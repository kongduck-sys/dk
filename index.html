    // ========================================
    // 🔀 Router Components
    // ========================================
    const RouterContext = createContext({ path: '/', params: {}, navigate: () => {} });

    const getHashPath = () => {
      const raw = window.location.hash.replace(/^#/, '');
      return raw.startsWith('/') ? raw.split('?')[0] : '/';
    };

    function matchRoute(pattern, path) {
      const p = pattern.split('/').filter(Boolean);
      const s = path.split('/').filter(Boolean);
      if (p.length !== s.length) return null;
      const params = {};
      for (let i = 0; i < p.length; i++) {
        if (p[i].startsWith(':')) params[p[i].slice(1)] = decodeURIComponent(s[i]);
        else if (p[i] !== s[i]) return null;
      }
      return params;
    }

    function Router({ children }) {
      const [path, setPath] = useState(getHashPath);
      useEffect(() => {
        const onChange = () => { setPath(getHashPath()); window.scrollTo(0, 0); };
        window.addEventListener('hashchange', onChange);
        return () => window.removeEventListener('hashchange', onChange);
      }, []);
      const navigate = useCallback((to) => { window.location.hash = to; }, []);
      return <RouterContext.Provider value={{ path, params: {}, navigate }}>{children}</RouterContext.Provider>;
    }

    const useRouter = () => useContext(RouterContext);
    const useParams = () => useContext(RouterContext).params;

    function Route() { return null; }

    function Routes({ children, fallback = null }) {
      const router = useRouter();
      for (const child of React.Children.toArray(children)) {
        const params = matchRoute(child.props.path, router.path);
        if (params) {
          return <RouterContext.Provider value={{ ...router, params }}>{child.props.element}</RouterContext.Provider>;
        }
      }
      return fallback;
    }

    function Link({ to, className = '', children, ...rest }) {
      return <a href={`#${to}`} className={className} {...rest}>{children}</a>;
    }

      const [errors, setErrors] = useState({});
      const [status, setStatus] = useState('idle'); // idle | loading | success | error

      const update = (key) => (e) => {
        let v = key === 'agree' ? e.target.checked : e.target.value;
        if (key === 'tel') v = v.replace(/[^0-9-]/g, '');

      const validate = () => {
        const er = {};
        if (!form.name.trim()) er.name = '이름을 입력해주세요.';
        if (!/^0\d{1,2}-?\d{3,4}-?\d{4}$/.test(form.tel)) er.tel = '연락처를 정확히 입력해주세요.';

        setErrors(er);
        return Object.keys(er).length === 0;

        if (!validate()) return;
        setStatus('loading');
        try {

            body: JSON.stringify({ name: form.name, tel: form.tel, contents: form.contents, agree: form.agree, website: form.website }),

    // ========================================
    // 🗂️ 팝업 · 이벤트 데이터 (관리자 페이지에서 등록 → /api/content)
    //   · 한 번 불러온 결과는 페이지를 옮겨 다녀도 다시 받지 않는다
    //   · 서버에 연결되지 않으면(로컬 파일 등) 이벤트는 기본 목록(EVENTS)으로 대체
    // ========================================
    const KAKAO_URL = 'http://pf.kakao.com/_cNdEn';
    let siteContentPromise = null;
    const loadSiteContent = () => {
      if (!siteContentPromise) {
        siteContentPromise = fetch('/api/content')
          .then(r => (r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`))))
          .then(j => ({ popups: j.popups || [], events: j.events || [], live: true }))
          .catch(() => ({ popups: [], events: EVENTS.map(e => ({ id: null, title: e.title, image: e.img, price: e.price })), live: false }));
      }
      return siteContentPromise;
    };
    function useSiteContent() {
      const [data, setData] = useState(null);
      useEffect(() => {
        let alive = true;
        loadSiteContent().then(d => alive && setData(d));
        return () => { alive = false; };
      }, []);
      return data;
    }

    const fmtPrice = (p) => (p > 0
      ? <><b className="text-xl text-mint-700">{Number(p).toLocaleString('ko-KR')}</b><span className="text-sm text-ink"> 원~</span></>
      : <span className="text-sm text-[#888]">가격 상담</span>);
    const fmtPeriod = (s, e) => (s || e ? `${(s || '').replace(/-/g, '.')} ~ ${(e || '').replace(/-/g, '.')}` : '');

    // 팝업 클릭 시 이동할 주소 (메뉴 페이지 · 이벤트 상세 · 외부 링크)
    const popupHref = (p) => {
      if (p.link_type === 'page' && p.link_target) return { hash: p.link_target };
      if (p.link_type === 'event' && p.link_target) return { hash: `/event/${p.link_target}` };
      if (p.link_type === 'url' && p.link_target) return { url: p.link_target };
      return null;
    };

    // '오늘 하루 보지 않기' — 이 브라우저에서 한국 날짜 기준 오늘만 숨김
    const POPUP_HIDE_KEY = 'lineco_popup_hide_date';
    const kstToday = () => new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 10);
    const isPopupHiddenToday = () => { try { return localStorage.getItem(POPUP_HIDE_KEY) === kstToday(); } catch { return false; } };

    function HomePopup() {
      const data = useSiteContent();
      const [open, setOpen] = useState(() => !isPopupHiddenToday());
      const [idx, setIdx] = useState(0);
      const [paused, setPaused] = useState(false);
      const popups = data?.popups || [];
      const n = popups.length;

      useEffect(() => {
        if (!open || n < 2 || paused) return;
        const t = setInterval(() => setIdx(i => (i + 1) % n), 4000);
        return () => clearInterval(t);
      }, [open, n, paused]);
      useEffect(() => {
        if (!open || !n) return;
        const onKey = (e) => e.key === 'Escape' && setOpen(false);
        document.addEventListener('keydown', onKey);
        return () => document.removeEventListener('keydown', onKey);
      }, [open, n]);

      if (!open || !n) return null;
      const cur = popups[Math.min(idx, n - 1)];
      const go = (d) => setIdx(i => (i + d + n) % n);
      const hideToday = () => { try { localStorage.setItem(POPUP_HIDE_KEY, kstToday()); } catch {} setOpen(false); };
      const onClickSlide = (p) => {
        const h = popupHref(p);
        if (!h) return;
        setOpen(false);
        if (h.url) window.open(h.url, '_blank', 'noopener');
        else window.location.hash = h.hash;
      };

      return (
        <div className="fixed inset-0 z-[9000] flex items-center justify-center p-4 bg-black/45" onClick={() => setOpen(false)}>
          <div role="dialog" aria-modal="true" aria-label="공지 팝업" onClick={(e) => e.stopPropagation()}
            onMouseEnter={() => setPaused(true)} onMouseLeave={() => setPaused(false)}
            className="w-full max-w-[864px] bg-white rounded-[12px] overflow-hidden shadow-[0_12px_40px_rgba(0,0,0,0.25)]">
            <div className="relative bg-cream">
              {popupHref(cur) ? (
                <button type="button" onClick={() => onClickSlide(cur)} className="block w-full" aria-label={`${cur.title} 자세히 보기`}>
                  <img src={img(cur.image)} alt={cur.title} className="w-full aspect-[141/100] object-cover md:aspect-auto md:h-auto md:max-h-[80vh] md:object-contain mx-auto" />
                </button>
              ) : (
                <img src={img(cur.image)} alt={cur.title} className="w-full aspect-[141/100] object-cover md:aspect-auto md:h-auto md:max-h-[80vh] md:object-contain mx-auto" />
              )}
              {n > 1 && (
                <>
                  <button type="button" onClick={() => go(-1)} aria-label="이전 팝업"
                    className="absolute left-1 md:left-2 top-1/2 -translate-y-1/2 w-7 h-7 md:w-9 md:h-9 rounded-full bg-black/25 md:bg-black/35 text-white text-base md:text-lg leading-none hover:bg-black/55">‹</button>
                  <button type="button" onClick={() => go(1)} aria-label="다음 팝업"
                    className="absolute right-1 md:right-2 top-1/2 -translate-y-1/2 w-7 h-7 md:w-9 md:h-9 rounded-full bg-black/25 md:bg-black/35 text-white text-base md:text-lg leading-none hover:bg-black/55">›</button>
                  <div className="absolute bottom-3 inset-x-0 flex justify-center gap-1.5">
                    {popups.map((p, i) => (
                      <button key={p.id} type="button" onClick={() => setIdx(i)} aria-label={`${i + 1}번째 팝업`} aria-current={i === idx}
                        className={`h-2 rounded-full transition-all ${i === idx ? 'w-5 bg-white' : 'w-2 bg-white/60'}`} />
                    ))}
                  </div>
                </>
              )}
            </div>
            <div className="grid grid-cols-2 border-t border-black/10 text-sm">
              <button type="button" onClick={hideToday} className="h-12 text-[#666] hover:text-ink border-r border-black/10">오늘 하루 보지 않기</button>
              <button type="button" onClick={() => setOpen(false)} className="h-12 font-medium text-ink hover:text-mint-700">닫기</button>
            </div>
          </div>
        </div>
      );
    }

    // ========================================
    // 📄 Sub Pages — 이벤트 / 404
    // ========================================
    function EventCard({ e }) {
      const body = (
        <>
          <div className="aspect-[350/250] overflow-hidden bg-cream">
            {e.image && <img src={img(e.image)} alt={e.title} loading="lazy" className="w-full h-full object-cover transition-transform duration-300 group-hover:scale-110" />}
          </div>
          <h3 className="mt-5 text-lg md:text-xl font-medium leading-[1.4] text-[#0f0f0f]">{e.title}</h3>

          <p className="mt-2 text-right">{fmtPrice(e.price)}</p>
        </>
      );
      // DB 이벤트는 상세 페이지로, 서버 연결이 안 될 때의 기본 목록은 카카오톡 상담으로
      return e.id
        ? <Link to={`/event/${e.id}`} className="group block">{body}</Link>
        : <a href={KAKAO_URL} target="_blank" rel="noopener noreferrer" className="group block">{body}</a>;
    }

    function EventPage() {
      const data = useSiteContent();
      const events = data?.events || [];
      return (
        <SubLayout title="이벤트" en="EVENT" bg={5}>
          <Container className="pt-16 md:pt-[100px]">
            <SectionTitle title="원하는 시술을 만나보세요" />
            {!data ? (
              <div className="mt-12 md:mt-[70px] grid sm:grid-cols-2 lg:grid-cols-3 gap-6" aria-busy="true">
                {[0, 1, 2].map(i => <div key={i} className="aspect-[350/250] bg-cream animate-pulse" />)}
              </div>
            ) : events.length === 0 ? (
              <p className="mt-16 py-20 text-center text-[#888] bg-cream">진행 중인 이벤트가 없습니다.</p>
            ) : (
              <div className="mt-12 md:mt-[70px] grid sm:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-y-12">
                {events.map((e, i) => <EventCard key={e.id || i} e={e} />)}
              </div>
            )}
          </Container>
        </SubLayout>
      );
    }

    function EventDetailPage() {
      const { id } = useParams();
      const data = useSiteContent();
      const [ev, setEv] = useState(undefined); // undefined: 불러오는 중 · null: 없음
      useEffect(() => {
        if (!data) return;
        const hit = data.events.find(e => String(e.id) === String(id));
        if (hit) return setEv(hit);
        if (!data.live) return setEv(null);
        let alive = true;
        fetch(`/api/content?event=${encodeURIComponent(id)}`)
          .then(r => (r.ok ? r.json() : null))
          .then(j => alive && setEv(j?.event || null))
          .catch(() => alive && setEv(null));
        return () => { alive = false; };
      }, [data, id]);

      return (
        <SubLayout title="이벤트" en="EVENT" bg={5}>
          <Container className="pt-16 md:pt-[100px]">
            <div className="max-w-[900px] mx-auto">
            {ev === undefined ? (
              <div className="aspect-[350/250] bg-cream animate-pulse" aria-busy="true" />
            ) : ev === null ? (
              <div className="py-20 text-center bg-cream">
                <p className="text-[#666]">종료되었거나 찾을 수 없는 이벤트입니다.</p>
                <Link to="/event" className="line-link mt-6 inline-block text-sm font-medium text-ink-brown">이벤트 목록 보기</Link>
              </div>
            ) : (
              <article>
                <p className="font-roboto text-[11px] md:text-xs tracking-[3px] text-mint-700">EVENT</p>
                <h2 className="mt-2 font-serif text-[26px] md:text-[36px] leading-[1.4] text-ink-dark">{ev.title}</h2>
                <div className="mt-4 flex flex-wrap items-end justify-between gap-2 pb-6 border-b border-black/10">
                  <p className="text-sm text-[#888]">{fmtPeriod(ev.start_date, ev.end_date) || '상시 진행'}</p>
                  <p>{fmtPrice(ev.price)}</p>
                </div>
                {ev.image && <img src={img(ev.image)} alt={ev.title} className="mt-8 w-full h-auto" />}
                {ev.description && <p className="mt-8 text-[15px] md:text-base leading-[1.9] text-ink whitespace-pre-line">{ev.description}</p>}
                <div className="mt-10 flex flex-col sm:flex-row justify-center gap-3">
                  <a href={RESERVE_URL} target="_blank" rel="noopener noreferrer" className="btn-solid-dark">진료 예약하기</a>
                  <a href={KAKAO_URL} target="_blank" rel="noopener noreferrer" className="btn-line-dark">카카오톡 상담</a>
