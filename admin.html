    // ========================================

    // ※ 로그인·상담 신청은 실제 서버(/api/admin, JWT HttpOnly 쿠키)와 DB를 사용합니다.
    // ※ 회원·후기·이벤트·팝업·통계·설정은 아직 DB가 없어 예시 데이터(이 브라우저에만 저장)입니다.

    // 인증 만료(401) 시 로그인 화면으로 돌려보내기 위한 전역 콜백
    let onUnauthorized = () => {};

    class ApiError extends Error {
      constructor(message, status) { super(message); this.status = status; }
    }

    // 관리자 API 호출 — 쿠키는 브라우저가 자동으로 붙인다 (토큰을 JS에서 다루지 않음)
    async function api(path, { method = 'GET', body, query } = {}) {
      const qs = query ? '?' + new URLSearchParams(Object.entries(query).filter(([, v]) => v !== '' && v != null)).toString() : '';
      let res;
      try {
        res = await fetch(`${API_BASE_URL}${path}${qs}`, {
          method,
          credentials: 'same-origin',
          headers: body ? { 'Content-Type': 'application/json' } : undefined,
          body: body ? JSON.stringify(body) : undefined,
        });
      } catch {
        throw new ApiError('서버에 연결할 수 없습니다. 로컬 파일이 아닌 배포 주소(또는 vercel dev)로 열어주세요.', 0);
      }
      const json = await res.json().catch(() => ({}));
      if (res.status === 401 && path !== '/me' && path !== '/login') onUnauthorized();
      if (!res.ok || json.ok === false) throw new ApiError(json.message || `요청 실패 (${res.status})`, res.status);
      return json;
    }

    // 데이터 로딩 훅 (loading / error / reload)
    function useApi(path, query) {
      const key = JSON.stringify(query || {});
      const [state, setState] = useState({ data: null, loading: true, error: null });
      const [tick, setTick] = useState(0);
      useEffect(() => {
        let alive = true;
        setState(s => ({ ...s, loading: true, error: null }));
        api(path, { query })
          .then(data => alive && setState({ data, loading: false, error: null }))
          .catch(error => alive && setState(s => ({ ...s, loading: false, error })));
        return () => { alive = false; };
      }, [path, key, tick]);
      return { ...state, reload: () => setTick(t => t + 1) };
    }

    function useDebounced(value, ms = 300) {
      const [v, setV] = useState(value);
      useEffect(() => { const t = setTimeout(() => setV(value), ms); return () => clearTimeout(t); }, [value, ms]);
      return v;

        hoursWeekday: '오전 10:30 - 오후 8:30', hoursSat: '오전 10:30 - 오후 4:00', lunch: '오후 2:00 - 오후 3:00',

      },
      visits: Array.from({ length: 14 }, (_, i) => ({ date: daysAgo(13 - i), count: 80 + ((i * 37) % 90) })),
    };

    const CONSULT_STATUS = {
      new: { label: '신규', cls: 'bg-brand/10 text-brand-600' },
      contacted: { label: '연락완료', cls: 'bg-mint/20 text-mint-deep' },
      done: { label: '상담완료', cls: 'bg-ink/10 text-ink-mid' },
      cancel: { label: '취소', cls: 'bg-danger/10 text-danger' },
    };

    const fmtDate = (iso, withTime = false) => {
      if (!iso) return '-';
      const d = new Date(iso);
      const p = (n) => String(n).padStart(2, '0');
      const base = `${d.getFullYear()}.${p(d.getMonth() + 1)}.${p(d.getDate())}`;
      return withTime ? `${base} ${p(d.getHours())}:${p(d.getMinutes())}` : base;
    };
    const won = (n) => (n > 0 ? `${Number(n).toLocaleString('ko-KR')}원` : '가격 상담');
    const isToday = (iso) => new Date(iso).toDateString() === today.toDateString();

    // ========================================
    // 🗄️ Store (useReducer + localStorage)
    // ========================================
    const StoreContext = createContext(null);

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? { ...SEED, ...JSON.parse(raw) } : SEED;
      } catch { return SEED; }
    }

    function reducer(state, action) {
      const { type, key, item, id, patch } = action;
      switch (type) {
        case 'add': {
          const nextId = Math.max(0, ...state[key].map(x => x.id)) + 1;
          return { ...state, [key]: [{ ...item, id: nextId }, ...state[key]] };
        }
        case 'update':
          return { ...state, [key]: state[key].map(x => (x.id === id ? { ...x, ...patch } : x)) };
        case 'remove':
          return { ...state, [key]: state[key].filter(x => x.id !== id) };
        case 'settings':
          return { ...state, settings: { ...state.settings, ...patch } };
        case 'reset':
          return SEED;
        default:
          return state;
      }
    }

    function StoreProvider({ children }) {
      const [state, dispatch] = useReducer(reducer, undefined, loadState);
      useEffect(() => {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
      }, [state]);
      return <StoreContext.Provider value={{ state, dispatch }}>{children}</StoreContext.Provider>;
    }
    const useStore = () => useContext(StoreContext);

    // 토스트 알림
    const ToastContext = createContext(() => {});
    function ToastProvider({ children }) {
      const [msg, setMsg] = useState(null);
      useEffect(() => {
        if (!msg) return;
        const t = setTimeout(() => setMsg(null), 2200);
        return () => clearTimeout(t);
      }, [msg]);
      return (
        <ToastContext.Provider value={setMsg}>
          {children}
          {msg && (
            <div role="status" className="fixed bottom-6 left-1/2 -translate-x-1/2 z-[200] px-5 py-3 rounded-lg bg-ink text-white text-sm shadow-lg">{msg}</div>
          )}
        </ToastContext.Provider>
      );
    }
    const useToast = () => useContext(ToastContext);

    // ========================================
    // 🎨 Design System Components
    // ========================================
    function Button({ variant = 'primary', size = 'md', disabled = false, onClick, type = 'button', className = '', children, ...rest }) {
      const variants = {
        primary: 'bg-brand text-white hover:bg-brand-600',
        secondary: 'bg-white text-ink border border-line hover:border-brand hover:text-brand',
        danger: 'bg-danger text-white hover:opacity-90',
        ghost: 'bg-transparent text-ink-mid hover:text-brand',
        mint: 'bg-mint text-white hover:bg-mint-dark',
      };
      const sizes = { sm: 'h-8 px-3 text-xs', md: 'h-10 px-4 text-sm', lg: 'h-12 px-6 text-base' };
      return (
        <button type={type} onClick={onClick} disabled={disabled}
          className={`inline-flex items-center justify-center gap-1.5 rounded-md font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed focus:outline-none focus-visible:ring-2 focus-visible:ring-brand/40 ${variants[variant]} ${sizes[size]} ${className}`}
          {...rest}>
          {children}
        </button>
      );
    }

    function Input({ type = 'text', label, value, onChange, placeholder, error, disabled = false, className = '', id, ...rest }) {
      return (
        <div className={className}>
          {label && <label htmlFor={id} className="block mb-1.5 text-[13px] font-medium text-ink-mid">{label}</label>}
          <input id={id} type={type} value={value} onChange={onChange} placeholder={placeholder} disabled={disabled} aria-invalid={!!error}
            className={`w-full h-10 px-3 rounded-md border bg-white text-sm outline-none transition-colors placeholder:text-ink-light/70 disabled:bg-bg ${error ? 'border-danger' : 'border-line focus:border-brand'}`}
            {...rest} />
          {error && <p className="mt-1 text-xs text-danger">{error}</p>}
        </div>
      );
    }

    function Textarea({ label, id, value, onChange, rows = 4, placeholder, className = '' }) {
      return (
        <div className={className}>
          {label && <label htmlFor={id} className="block mb-1.5 text-[13px] font-medium text-ink-mid">{label}</label>}
          <textarea id={id} value={value} onChange={onChange} rows={rows} placeholder={placeholder}
            className="w-full px-3 py-2 rounded-md border border-line bg-white text-sm outline-none focus:border-brand resize-y" />
        </div>
      );
    }

    function Select({ label, id, value, onChange, options, className = '' }) {
      return (
        <div className={className}>
          {label && <label htmlFor={id} className="block mb-1.5 text-[13px] font-medium text-ink-mid">{label}</label>}
          <select id={id} value={value} onChange={onChange}
            className="w-full h-10 px-3 rounded-md border border-line bg-white text-sm outline-none focus:border-brand">
            {options.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
          </select>
        </div>
      );
    }

    function Toggle({ checked, onChange, label }) {
      return (
        <button type="button" role="switch" aria-checked={checked} aria-label={label} onClick={() => onChange(!checked)}
          className={`relative inline-flex w-10 h-[22px] rounded-full transition-colors ${checked ? 'bg-brand' : 'bg-line'}`}>
          <span className={`absolute top-[3px] w-4 h-4 rounded-full bg-white shadow transition-all ${checked ? 'left-[21px]' : 'left-[3px]'}`} />
        </button>
      );
    }

    function Card({ className = '', children }) {
      return <div className={`bg-white rounded-xl border border-line-soft shadow-[0_0_9px_rgba(103,103,103,0.08)] ${className}`}>{children}</div>;
    }

    function Badge({ className = '', children }) {
      return <span className={`inline-flex items-center px-2 py-0.5 rounded text-xs font-medium whitespace-nowrap ${className}`}>{children}</span>;
    }

    function Modal({ isOpen, onClose, title, size = 'md', children, footer }) {
      useEffect(() => {
        if (!isOpen) return;
        const onKey = (e) => e.key === 'Escape' && onClose();
        document.addEventListener('keydown', onKey);
        return () => document.removeEventListener('keydown', onKey);
      }, [isOpen, onClose]);
      if (!isOpen) return null;
      const sizes = { sm: 'max-w-sm', md: 'max-w-lg', lg: 'max-w-2xl' };
      return (
        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/40" onClick={onClose}>
          <div role="dialog" aria-modal="true" aria-labelledby="modal-title" onClick={(e) => e.stopPropagation()}
            className={`w-full ${sizes[size]} bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col max-h-[90vh]`}>
            <div className="flex items-center justify-between px-6 h-14 border-b border-line-soft shrink-0">
              <h3 id="modal-title" className="font-bold text-ink">{title}</h3>
              <button onClick={onClose} aria-label="닫기" className="text-2xl leading-none text-ink-light hover:text-ink">×</button>
            </div>
            <div className="px-6 py-5 overflow-y-auto">{children}</div>
            {footer && <div className="px-6 py-4 border-t border-line-soft bg-bg-card flex justify-end gap-2 shrink-0">{footer}</div>}
          </div>
        </div>
      );
    }

    function ConfirmModal({ isOpen, onClose, onConfirm, message }) {
      return (

          footer={<><Button variant="secondary" onClick={onClose}>취소</Button><Button variant="danger" onClick={onConfirm}>삭제</Button></>}>
          <p className="text-sm leading-6">{message}</p>
        </Modal>
      );
    }

    function PageHeader({ title, desc, actions }) {

          {actions && <div className="flex gap-2">{actions}</div>}

    function EmptyRow({ colSpan, text = '데이터가 없습니다.' }) {
      return <tr><td colSpan={colSpan} className="py-16 text-center text-sm text-ink-light">{text}</td></tr>;

    function Table({ head, children }) {
      return (

    function SearchBar({ value, onChange, placeholder = '검색어 입력', children }) {

    function Pagination({ page, total, perPage, onChange }) {
      const pages = Math.max(1, Math.ceil(total / perPage));
      if (pages <= 1) return null;
      return (
        <nav className="flex justify-center gap-1 py-4" aria-label="페이지">

    // ========================================
    // 🔀 Router Components
    // ========================================
    const RouterContext = createContext({ path: '/', params: {}, navigate: () => {} });
    const getHashPath = () => {
      const raw = window.location.hash.replace(/^#/, '');
      return raw.startsWith('/') ? raw.split('?')[0] : '/';
    };

    function matchRoute(pattern, path) {
      const p = pattern.split('/').filter(Boolean);
      const s = path.split('/').filter(Boolean);
      if (p.length !== s.length) return null;
      const params = {};
      for (let i = 0; i < p.length; i++) {
        if (p[i].startsWith(':')) params[p[i].slice(1)] = decodeURIComponent(s[i]);
        else if (p[i] !== s[i]) return null;
      }
      return params;
    }

    function Router({ children }) {
      const [path, setPath] = useState(getHashPath);
      useEffect(() => {
        const onChange = () => { setPath(getHashPath()); window.scrollTo(0, 0); };
        window.addEventListener('hashchange', onChange);
        return () => window.removeEventListener('hashchange', onChange);
      }, []);
      const navigate = useCallback((to) => { window.location.hash = to; }, []);
      return <RouterContext.Provider value={{ path, params: {}, navigate }}>{children}</RouterContext.Provider>;
    }
    const useRouter = () => useContext(RouterContext);
    const useParams = () => useContext(RouterContext).params;

    function Route() { return null; }
    function Routes({ children, fallback = null }) {
      const router = useRouter();
      for (const child of React.Children.toArray(children)) {
        const params = matchRoute(child.props.path, router.path);
        if (params) return <RouterContext.Provider value={{ ...router, params }}>{child.props.element}</RouterContext.Provider>;
      }
      return fallback;
    }
    function Link({ to, className = '', children, ...rest }) {
      return <a href={`#${to}`} className={className} {...rest}>{children}</a>;
    }

    // ========================================
    // 🧩 Common/Layout Components
    // ========================================

    function DemoNotice() {

          <div className="max-w-[1600px] mx-auto px-5 py-2">
            <b>상담 신청</b>은 실제 DB와 연결되어 있습니다 · 회원·후기·이벤트·팝업·통계·설정은 아직 예시 데이터입니다(이 브라우저에만 저장).
          </div>

    function ErrorBox({ error, onRetry }) {
      return (
        <div role="alert" className="py-14 text-center text-sm">
          <p className="text-danger">{error?.message || '불러오지 못했습니다.'}</p>

    function Spinner({ label = '불러오는 중…' }) {
      return (
        <div className="py-14 flex flex-col items-center gap-3 text-sm text-ink-light" role="status">

    // ========================================
    // 📄 Page: 로그인 (POST /api/admin/login → HttpOnly 쿠키)
    // ========================================
    function LoginPage({ onLogin, notice }) {
      const [form, setForm] = useState({ id: '', pw: '', save: false });
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      useEffect(() => {
        try {
          const saved = localStorage.getItem('lineco_admin_saved_id');
          if (saved) setForm(f => ({ ...f, id: saved, save: true }));
        } catch {}
      }, []);

      const submit = async (e) => {
        e.preventDefault();
        if (!form.id.trim()) return setError('아이디를 입력하세요.');
        if (!form.pw) return setError('비밀번호를 입력하세요.');
        setLoading(true);
        setError('');
        try {
          const { user } = await api('/login', { method: 'POST', body: { username: form.id.trim(), password: form.pw } });
          try {
            if (form.save) localStorage.setItem('lineco_admin_saved_id', form.id.trim());
            else localStorage.removeItem('lineco_admin_saved_id');
          } catch {}
          onLogin(user);
        } catch (err) {
          setError(err.message);
          setForm(f => ({ ...f, pw: '' }));
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-5 bg-bg">
          <div className="w-full max-w-[600px] bg-white rounded-[20px] px-6 sm:px-14 py-12 shadow-[0_0_9.3px_rgba(103,103,103,0.15)]">
            <div className="text-center">
              <img src={`${SITE_IMG}/logo_full_color.svg`} alt="" className="h-14 mx-auto" onError={(e) => { e.currentTarget.style.display = 'none'; }} />
              <p className="mt-4 text-sm text-ink-light">라인앤코한의원</p>
              <h1 className="mt-1 text-2xl font-bold text-ink">makeline 관리자</h1>
            </div>
            {notice && <p className="mt-6 px-4 py-2.5 rounded-md bg-brand/10 text-sm text-brand-600 text-center">{notice}</p>}
            <form onSubmit={submit} className="mt-10 space-y-3" noValidate>
              <Input id="p_id" label="아이디" placeholder="아이디 입력" value={form.id} autoComplete="username" disabled={loading}
                onChange={(e) => { setForm({ ...form, id: e.target.value }); setError(''); }} className="[&_label]:sr-only" />
              <Input id="p_pass" type="password" label="비밀번호" placeholder="비밀번호 입력" value={form.pw} autoComplete="current-password" disabled={loading}
                onChange={(e) => { setForm({ ...form, pw: e.target.value }); setError(''); }} className="[&_label]:sr-only" />
              <label className="flex items-center gap-2 pt-1 text-sm text-ink-mid cursor-pointer w-fit">
                <input type="checkbox" checked={form.save} onChange={(e) => setForm({ ...form, save: e.target.checked })} className="w-4 h-4 accent-[#339BFE]" />
                아이디저장
              </label>
              {error && <p role="alert" className="text-sm text-danger">{error}</p>}
              <Button type="submit" size="lg" disabled={loading} className="w-full !mt-6">{loading ? '로그인 중…' : '로그인'}</Button>
            </form>
          </div>
        </div>
      );
    }

    // ========================================
    // 📄 Page: 대시보드 (상담 = 실제 DB, 나머지 = 예시)
    // ========================================

      const summary = data?.summary;
      const hiddenReviews = state.reviews.filter(r => !r.visible).length;
      const todayVisits = state.visits[state.visits.length - 1]?.count || 0;
      const num = (v) => (loading ? '…' : (v ?? 0).toLocaleString('ko-KR'));

      const stats = [
        { label: '오늘 상담 신청', value: num(summary?.today), to: '/consults', color: 'text-brand' },
        { label: '미처리 상담', value: num(summary?.new), to: '/consults', color: 'text-danger' },
        { label: '전체 회원 (예시)', value: state.members.length.toLocaleString('ko-KR'), to: '/members', color: 'text-ink' },
        { label: '오늘 방문자 (예시)', value: todayVisits.toLocaleString('ko-KR'), to: '/stats', color: 'text-mint-deep' },

      return (
        <>
          <PageHeader title="대시보드" desc={`${fmtDate(today.toISOString())} 기준`} />
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
            {stats.map(s => (
              <Link key={s.label} to={s.to} className="block">
                <Card className="p-5 hover:border-brand/40 transition-colors">
                  <p className="text-sm text-ink-light">{s.label}</p>
                  <p className={`mt-2 text-3xl font-bold ${s.color}`}>{s.value}</p>
                </Card>
              </Link>
            ))}
          </div>

          <div className="mt-6 grid lg:grid-cols-3 gap-6">
            <Card className="lg:col-span-2">
              <div className="flex items-center justify-between px-5 h-14 border-b border-line-soft">
                <h3 className="font-bold">최근 상담 신청</h3>
                <Link to="/consults" className="text-sm text-brand hover:underline">전체보기</Link>
              </div>
              {loading ? <Spinner /> : error ? <ErrorBox error={error} onRetry={reload} /> : (
                <ul className="divide-y divide-line-soft">
                  {data.items.map(c => (
                    <li key={c.id} className="flex items-center gap-3 px-5 py-3.5 text-sm">
                      <Badge className={`w-[68px] justify-center shrink-0 ${CONSULT_STATUS[c.status].cls}`}>{CONSULT_STATUS[c.status].label}</Badge>
                      <span className="font-medium w-16 shrink-0 truncate">{c.name}</span>
                      <span className="flex-1 truncate text-ink-mid">{c.content || '-'}</span>
                      <span className="text-xs text-ink-light whitespace-nowrap">{fmtDate(c.created_at, true)}</span>

            </Card>

            <Card>
              <div className="px-5 h-14 flex items-center border-b border-line-soft"><h3 className="font-bold">확인 필요</h3></div>
              <ul className="p-5 space-y-3 text-sm">
                <li className="flex justify-between"><span>미처리 상담</span><Link to="/consults" className="font-bold text-danger">{num(summary?.new)}건</Link></li>
                <li className="flex justify-between"><span>연락완료 (상담 대기)</span><Link to="/consults" className="font-bold text-ink">{num(summary?.contacted)}건</Link></li>
                <li className="flex justify-between"><span>비공개 리뷰 (예시)</span><Link to="/reviews" className="font-bold text-ink">{hiddenReviews}건</Link></li>
                <li className="flex justify-between"><span>노출 중 이벤트 (예시)</span><Link to="/events" className="font-bold text-ink">{state.events.filter(e => e.visible).length}건</Link></li>

          <Card className="mt-6 p-5">
            <h3 className="font-bold mb-4">최근 14일 방문자 <span className="text-xs font-normal text-ink-light">(예시)</span></h3>
            <VisitChart data={state.visits} />
          </Card>

    function VisitChart({ data }) {
      const max = Math.max(1, ...data.map(d => d.count));
      return (
        <div className="flex items-end gap-1.5 sm:gap-2 h-48" role="img" aria-label="최근 14일 방문자 막대그래프">
          {data.map(d => (
            <div key={d.date} className="flex-1 flex flex-col items-center justify-end h-full group">
              <span className="text-[10px] text-ink-light opacity-0 group-hover:opacity-100">{d.count}</span>
              <div className="w-full rounded-t bg-brand/70 group-hover:bg-brand transition-colors" style={{ height: `${(d.count / max) * 85}%` }} />
              <span className="mt-1 text-[10px] text-ink-light">{new Date(d.date).getDate()}일</span>
            </div>
          ))}
        </div>
      );
    }

    // ========================================
    // 📄 Page: 상담 신청 관리 (실제 DB — /api/admin/consults)
    // ========================================
    function ConsultsPage() {
      const toast = useToast();
      const [q, setQ] = useState('');
      const [status, setStatus] = useState('all');
      const [page, setPage] = useState(1);
      const [selected, setSelected] = useState(null);
      const [confirmId, setConfirmId] = useState(null);
      const [busy, setBusy] = useState(false);
      const PER = 20;
      const dq = useDebounced(q.trim());

      useEffect(() => { setPage(1); }, [dq, status]);

      const { data, loading, error, reload } = useApi('/consults', {
        q: dq, status: status === 'all' ? '' : status, page, size: PER,
      });

      const save = async (patch) => {
        setBusy(true);
        try {
          await api('/consults', { method: 'PATCH', query: { id: selected.id }, body: patch });
          setSelected(null);
          toast('저장되었습니다.');
          reload();
        } catch (e) { toast(e.message); } finally { setBusy(false); }
      };

      const remove = async () => {
        setBusy(true);
        try {
          await api('/consults', { method: 'DELETE', query: { id: confirmId } });
          setConfirmId(null);
          toast('삭제되었습니다.');
          reload();
        } catch (e) { toast(e.message); } finally { setBusy(false); }
      };

      const exportCsv = async () => {
        try {
          const { items } = await api('/consults', { query: { all: '1', q: dq, status: status === 'all' ? '' : status } });
          const rows = [['번호', '이름', '연락처', '상담내용', '신청일', '상태', '메모'],
            ...items.map(c => [c.id, c.name, c.phone, c.content || '', fmtDate(c.created_at, true), CONSULT_STATUS[c.status].label, c.memo || ''])];
          const csv = '﻿' + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
          const a = document.createElement('a');
          a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
          a.download = `상담신청_${fmtDate(today.toISOString())}.csv`;
          a.click();
          URL.revokeObjectURL(a.href);
        } catch (e) { toast(e.message); }
      };

      const s = data?.summary;
      const tabs = [{ value: 'all', label: '전체', n: s?.all }, ...Object.entries(CONSULT_STATUS).map(([v, c]) => ({ value: v, label: c.label, n: s?.[v] }))];

      return (
        <>
          <PageHeader title="상담 신청" desc="홈페이지 하단 '비대면 처방 / 진료상담 신청' 접수 내역 (실시간 DB)"
            actions={<>
              <Button variant="secondary" onClick={reload}>새로고침</Button>
              <Button variant="secondary" onClick={exportCsv}>엑셀(CSV) 다운로드</Button>
            </>} />
          <Card>
            <div className="flex flex-wrap gap-1 px-4 pt-4" role="tablist" aria-label="처리 상태">
              {tabs.map(t => (
                <button key={t.value} role="tab" aria-selected={status === t.value} onClick={() => setStatus(t.value)}
                  className={`h-9 px-3.5 rounded-full text-sm transition-colors ${status === t.value ? 'bg-brand text-white' : 'bg-bg text-ink-mid hover:bg-line-soft'}`}>
                  {t.label} <span className="opacity-70">{t.n ?? ''}</span>
                </button>
              ))}
            </div>
            <SearchBar value={q} onChange={setQ} placeholder="이름 · 연락처 · 상담내용 검색" />
            {loading && !data ? <Spinner /> : error ? <ErrorBox error={error} onRetry={reload} /> : (
              <div className={loading ? 'opacity-60 transition-opacity' : ''}>
                <Table head={['번호', '상태', '이름', '연락처', '상담내용', '신청일', '관리']}>
                  {data.items.length === 0 ? <EmptyRow colSpan={7} text={dq || status !== 'all' ? '조건에 맞는 상담 신청이 없습니다.' : '아직 접수된 상담 신청이 없습니다.'} /> : data.items.map(c => (
                    <tr key={c.id} className="hover:bg-bg-card">
                      <td className="px-4 py-3 text-ink-light">{c.id}</td>
                      <td className="px-4 py-3"><Badge className={CONSULT_STATUS[c.status].cls}>{CONSULT_STATUS[c.status].label}</Badge></td>
                      <td className="px-4 py-3 font-medium">{c.name}</td>
                      <td className="px-4 py-3 whitespace-nowrap"><a href={`tel:${c.phone}`} className="hover:text-brand">{c.phone}</a></td>
                      <td className="px-4 py-3 max-w-[320px] truncate">{c.content || '-'}{c.memo && <span className="ml-2 text-xs text-mint-deep">📝</span>}</td>
                      <td className="px-4 py-3 whitespace-nowrap text-ink-light">{fmtDate(c.created_at, true)}</td>
                      <td className="px-4 py-3 whitespace-nowrap">
                        <Button size="sm" variant="secondary" onClick={() => setSelected(c)}>상세</Button>
                        <Button size="sm" variant="ghost" onClick={() => setConfirmId(c.id)} className="hover:!text-danger">삭제</Button>
                      </td>
                    </tr>
                  ))}
                </Table>
                <Pagination page={page} total={data.total} perPage={PER} onChange={setPage} />
              </div>
            )}
          </Card>

          {selected && <ConsultDetail consult={selected} busy={busy} onClose={() => setSelected(null)} onSave={save} />}
          <ConfirmModal isOpen={confirmId !== null} onClose={() => setConfirmId(null)} onConfirm={remove}
            message="이 상담 신청을 삭제할까요? 삭제 후에는 되돌릴 수 없습니다." />
        </>
      );
    }

    function ConsultDetail({ consult, busy, onClose, onSave }) {
      const [status, setStatus] = useState(consult.status);
      const [memo, setMemo] = useState(consult.memo || '');
      return (
        <Modal isOpen onClose={onClose} title={`상담 신청 #${consult.id}`}
          footer={<><Button variant="secondary" onClick={onClose}>닫기</Button><Button disabled={busy} onClick={() => onSave({ status, memo })}>{busy ? '저장 중…' : '저장'}</Button></>}>
          <dl className="grid grid-cols-[80px_1fr] gap-y-3 text-sm">
            <dt className="text-ink-light">이름</dt><dd className="font-medium">{consult.name}</dd>
            <dt className="text-ink-light">연락처</dt><dd><a href={`tel:${consult.phone}`} className="text-brand">{consult.phone}</a></dd>
            <dt className="text-ink-light">신청일</dt><dd>{fmtDate(consult.created_at, true)}</dd>
            <dt className="text-ink-light">상담내용</dt><dd className="whitespace-pre-wrap">{consult.content || '-'}</dd>
            {consult.updated_at !== consult.created_at && <><dt className="text-ink-light">최종 수정</dt><dd>{fmtDate(consult.updated_at, true)}</dd></>}
          </dl>
          <div className="mt-6 space-y-4">
            <Select id="detail-status" label="처리 상태" value={status} onChange={(e) => setStatus(e.target.value)}
              options={Object.entries(CONSULT_STATUS).map(([v, s]) => ({ value: v, label: s.label }))} />
            <Textarea id="detail-memo" label="관리자 메모" value={memo} onChange={(e) => setMemo(e.target.value)} placeholder="연락 내용, 예약 일정 등" />
          </div>
        </Modal>
      );
    }

    // ========================================
    // 📄 Page: 회원 관리
    // ========================================
    function MembersPage() {
      const { state, dispatch } = useStore();
      const toast = useToast();
      const [q, setQ] = useState('');
      const [confirmId, setConfirmId] = useState(null);
      const list = state.members.filter(m => !q || [m.userId, m.name, m.phone].some(v => v.includes(q)));

      return (
        <>
          <PageHeader title="회원 관리" desc={`전체 ${state.members.length}명`} />

    function StatsPage() {
      const { state } = useStore();
      const total = state.visits.reduce((s, v) => s + v.count, 0);
      const avg = Math.round(total / Math.max(1, state.visits.length));
      const peak = state.visits.reduce((a, b) => (b.count > a.count ? b : a), state.visits[0] || { count: 0, date: '' });
      return (
        <>
          <PageHeader title="접속 통계" desc="최근 14일 (예시 데이터)" />
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <Card className="p-5"><p className="text-sm text-ink-light">14일 합계</p><p className="mt-2 text-3xl font-bold">{total.toLocaleString('ko-KR')}</p></Card>
            <Card className="p-5"><p className="text-sm text-ink-light">일 평균</p><p className="mt-2 text-3xl font-bold">{avg.toLocaleString('ko-KR')}</p></Card>
            <Card className="p-5"><p className="text-sm text-ink-light">최다 방문일</p><p className="mt-2 text-3xl font-bold text-brand">{peak.count}<span className="ml-2 text-sm font-normal text-ink-light">{fmtDate(peak.date)}</span></p></Card>
          </div>
          <Card className="mt-6 p-5"><VisitChart data={state.visits} /></Card>
          <Card className="mt-6">
            <Table head={['날짜', '방문자']}>
              {[...state.visits].reverse().map(v => (
                <tr key={v.date}><td className="px-4 py-2.5">{fmtDate(v.date)}</td><td className="px-4 py-2.5">{v.count.toLocaleString('ko-KR')}</td></tr>
              ))}
            </Table>
          </Card>
        </>
      );
    }

          <Modal isOpen={resetOpen} onClose={() => setResetOpen(false)} title="예시 데이터 초기화" size="sm"
            footer={<><Button variant="secondary" onClick={() => setResetOpen(false)}>취소</Button>
              <Button variant="danger" onClick={() => { dispatch({ type: 'reset' }); setF(SEED.settings); setResetOpen(false); toast('초기화되었습니다.'); }}>초기화</Button></>}>
            <p className="text-sm leading-6">이 브라우저에 저장된 모든 변경 내용을 지우고 처음 예시 데이터로 되돌립니다.</p>
          </Modal>
        </>
      );
    }

    function NotFoundPage() {
      return (
        <Card className="py-24 text-center">
          <p className="text-5xl font-bold text-brand">404</p>
          <p className="mt-3 text-ink-mid">페이지를 찾을 수 없습니다.</p>
          <Link to="/" className="inline-block mt-6 text-sm text-brand hover:underline">대시보드로</Link>
        </Card>
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================
    function App() {
      // 'checking' → 서버에 세션 확인 중 / null → 로그아웃 상태 / 객체 → 로그인한 관리자
      const [user, setUser] = useState('checking');
      const [notice, setNotice] = useState('');

      useEffect(() => {
        api('/me').then(r => setUser(r.user)).catch(() => setUser(null));
        // 사용 중 토큰이 만료되면(401) 로그인 화면으로
        onUnauthorized = () => { setUser(null); setNotice('로그인이 만료되었습니다. 다시 로그인해주세요.'); };
        return () => { onUnauthorized = () => {}; };
      }, []);

      const login = (u) => { setNotice(''); setUser(u); window.location.hash = '/'; };
      const logout = async () => {
        try { await api('/logout', { method: 'POST' }); } catch {}
        setNotice('로그아웃되었습니다.');
        setUser(null);
      };

      if (user === 'checking') {
        return <div className="min-h-screen flex items-center justify-center"><Spinner label="로그인 상태 확인 중…" /></div>;
      }
      if (!user) return <LoginPage onLogin={login} notice={notice} />;

      return (
        <StoreProvider>
          <ToastProvider>
            <Router>
              <Header user={user} onLogout={logout} />
              <DemoNotice />
              <main className="max-w-[1600px] mx-auto px-5 py-8">
                <Routes fallback={<NotFoundPage />}>
                  <Route path="/" element={<DashboardPage />} />
                  <Route path="/consults" element={<ConsultsPage />} />
                  <Route path="/members" element={<MembersPage />} />
                  <Route path="/reviews" element={<ReviewsPage />} />
                  <Route path="/photos" element={<PhotosPage />} />
                  <Route path="/events" element={<EventsPage />} />
                  <Route path="/popups" element={<PopupsPage />} />
                  <Route path="/stats" element={<StatsPage />} />
                  <Route path="/settings" element={<SettingsPage />} />
                </Routes>
              </main>
            </Router>
          </ToastProvider>
        </StoreProvider>
      );
    }

    // ========================================
    // Rendering
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
