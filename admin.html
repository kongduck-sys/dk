    // ========================================

    // ========================================

    // ※ 로그인·상담 신청은 실제 서버(/api/admin, JWT HttpOnly 쿠키)와 DB를 사용합니다.
    // ※ 이벤트·팝업은 실제 DB(/api/admin/content)를 사용합니다.
    // ※ 회원·리뷰·전후사진은 실제 DB(/api/admin/records), 통계·설정은 아직 예시 데이터(이 브라우저에만 저장)입니다.

    // 인증 만료(401) 시 로그인 화면으로 돌려보내기 위한 전역 콜백
    let onUnauthorized = () => {};

    class ApiError extends Error {
      constructor(message, status) { super(message); this.status = status; }
    }

    // 관리자 API 호출 — 쿠키는 브라우저가 자동으로 붙인다 (토큰을 JS에서 다루지 않음)
    async function api(path, { method = 'GET', body, query } = {}) {
      const qs = query ? '?' + new URLSearchParams(Object.entries(query).filter(([, v]) => v !== '' && v != null)).toString() : '';
      let res;
      try {
        res = await fetch(`${API_BASE_URL}${path}${qs}`, {
          method,
          credentials: 'same-origin',
          headers: body ? { 'Content-Type': 'application/json' } : undefined,
          body: body ? JSON.stringify(body) : undefined,
        });
      } catch {
        throw new ApiError('서버에 연결할 수 없습니다. 로컬 파일이 아닌 배포 주소(또는 vercel dev)로 열어주세요.', 0);
      }
      const json = await res.json().catch(() => ({}));
      if (res.status === 401 && path !== '/me' && path !== '/login') onUnauthorized();
      if (!res.ok || json.ok === false) throw new ApiError(json.message || `요청 실패 (${res.status})`, res.status);
      return json;
    }

    // 데이터 로딩 훅 (loading / error / reload)
    function useApi(path, query) {
      const key = JSON.stringify(query || {});
      const [state, setState] = useState({ data: null, loading: true, error: null });
      const [tick, setTick] = useState(0);
      useEffect(() => {
        let alive = true;
        setState(s => ({ ...s, loading: true, error: null }));
        api(path, { query })
          .then(data => alive && setState({ data, loading: false, error: null }))
          .catch(error => alive && setState(s => ({ ...s, loading: false, error })));
        return () => { alive = false; };
      }, [path, key, tick]);
      return { ...state, reload: () => setTick(t => t + 1) };
    }

    function useDebounced(value, ms = 300) {
      const [v, setV] = useState(value);
      useEffect(() => { const t = setTimeout(() => setV(value), ms); return () => clearTimeout(t); }, [value, ms]);
      return v;
    }

        address: '서울 서초구 서초대로77길 13 강남빌딩 5층',
        hoursWeekday: '오전 10:30 - 오후 8:30', hoursSat: '오전 10:30 - 오후 4:00', lunch: '오후 2:00 - 오후 3:00',
        topBanner: 'We find your hidden line.',
      },
      visits: Array.from({ length: 14 }, (_, i) => ({ date: daysAgo(13 - i), count: 80 + ((i * 37) % 90) })),
    };

    const CONSULT_STATUS = {
      new: { label: '신규', cls: 'bg-brand/10 text-brand-600' },
      contacted: { label: '연락완료', cls: 'bg-mint/20 text-mint-deep' },
      done: { label: '상담완료', cls: 'bg-ink/10 text-ink-mid' },
      cancel: { label: '취소', cls: 'bg-danger/10 text-danger' },
    };

    const fmtDate = (iso, withTime = false) => {
      if (!iso) return '-';
      const d = new Date(iso);
      const p = (n) => String(n).padStart(2, '0');
      const base = `${d.getFullYear()}.${p(d.getMonth() + 1)}.${p(d.getDate())}`;
      return withTime ? `${base} ${p(d.getHours())}:${p(d.getMinutes())}` : base;
    };
    const won = (n) => (n > 0 ? `${Number(n).toLocaleString('ko-KR')}원` : '가격 상담');
    const isToday = (iso) => new Date(iso).toDateString() === today.toDateString();

    // ========================================
    // 🗄️ Store (useReducer + localStorage)
    // ========================================
    const StoreContext = createContext(null);

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? { ...SEED, ...JSON.parse(raw) } : SEED;
      } catch { return SEED; }
    }

    function reducer(state, action) {
      const { type, key, item, id, patch } = action;
      switch (type) {
        case 'add': {
          const nextId = Math.max(0, ...state[key].map(x => x.id)) + 1;
          return { ...state, [key]: [{ ...item, id: nextId }, ...state[key]] };
        }
        case 'update':
          return { ...state, [key]: state[key].map(x => (x.id === id ? { ...x, ...patch } : x)) };
        case 'remove':
          return { ...state, [key]: state[key].filter(x => x.id !== id) };
        case 'settings':
          return { ...state, settings: { ...state.settings, ...patch } };
        case 'reset':
          return SEED;
        default:
          return state;
      }
    }

    function StoreProvider({ children }) {
      const [state, dispatch] = useReducer(reducer, undefined, loadState);
      useEffect(() => {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
      }, [state]);
      return <StoreContext.Provider value={{ state, dispatch }}>{children}</StoreContext.Provider>;
    }
    const useStore = () => useContext(StoreContext);

    // 토스트 알림
    const ToastContext = createContext(() => {});
    function ToastProvider({ children }) {
      const [msg, setMsg] = useState(null);
      useEffect(() => {
        if (!msg) return;
        const t = setTimeout(() => setMsg(null), 2200);
        return () => clearTimeout(t);
      }, [msg]);
      return (
        <ToastContext.Provider value={setMsg}>
          {children}
          {msg && (
            <div role="status" className="fixed bottom-6 left-1/2 -translate-x-1/2 z-[200] px-5 py-3 rounded-lg bg-ink text-white text-sm shadow-lg">{msg}</div>
          )}
        </ToastContext.Provider>
      );
    }
    const useToast = () => useContext(ToastContext);

    // ========================================
    // 🎨 Design System Components
    // ========================================
    function Button({ variant = 'primary', size = 'md', disabled = false, onClick, type = 'button', className = '', children, ...rest }) {
      const variants = {
        primary: 'bg-brand text-white hover:bg-brand-600',
        secondary: 'bg-white text-ink border border-line hover:border-brand hover:text-brand',
        danger: 'bg-danger text-white hover:opacity-90',
        ghost: 'bg-transparent text-ink-mid hover:text-brand',
        mint: 'bg-mint text-white hover:bg-mint-dark',
      };
      const sizes = { sm: 'h-8 px-3 text-xs', md: 'h-10 px-4 text-sm', lg: 'h-12 px-6 text-base' };
      return (
        <button type={type} onClick={onClick} disabled={disabled}
          className={`inline-flex items-center justify-center gap-1.5 rounded-md font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed focus:outline-none focus-visible:ring-2 focus-visible:ring-brand/40 ${variants[variant]} ${sizes[size]} ${className}`}
          {...rest}>
          {children}
        </button>
      );
    }

    function Input({ type = 'text', label, value, onChange, placeholder, error, disabled = false, className = '', id, ...rest }) {
      return (
        <div className={className}>
          {label && <label htmlFor={id} className="block mb-1.5 text-[13px] font-medium text-ink-mid">{label}</label>}
          <input id={id} type={type} value={value} onChange={onChange} placeholder={placeholder} disabled={disabled} aria-invalid={!!error}
            className={`w-full h-10 px-3 rounded-md border bg-white text-sm outline-none transition-colors placeholder:text-ink-light/70 disabled:bg-bg ${error ? 'border-danger' : 'border-line focus:border-brand'}`}
            {...rest} />
          {error && <p className="mt-1 text-xs text-danger">{error}</p>}
        </div>
      );
    }

    function Textarea({ label, id, value, onChange, rows = 4, placeholder, className = '' }) {
      return (
        <div className={className}>
          {label && <label htmlFor={id} className="block mb-1.5 text-[13px] font-medium text-ink-mid">{label}</label>}
          <textarea id={id} value={value} onChange={onChange} rows={rows} placeholder={placeholder}
            className="w-full px-3 py-2 rounded-md border border-line bg-white text-sm outline-none focus:border-brand resize-y" />
        </div>
      );
    }

    function Select({ label, id, value, onChange, options, className = '' }) {
      return (
        <div className={className}>
          {label && <label htmlFor={id} className="block mb-1.5 text-[13px] font-medium text-ink-mid">{label}</label>}
          <select id={id} value={value} onChange={onChange}
            className="w-full h-10 px-3 rounded-md border border-line bg-white text-sm outline-none focus:border-brand">
            {options.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
          </select>
        </div>
      );
    }

    function Toggle({ checked, onChange, label }) {
      return (
        <button type="button" role="switch" aria-checked={checked} aria-label={label} onClick={() => onChange(!checked)}
          className={`relative inline-flex w-10 h-[22px] rounded-full transition-colors ${checked ? 'bg-brand' : 'bg-line'}`}>
          <span className={`absolute top-[3px] w-4 h-4 rounded-full bg-white shadow transition-all ${checked ? 'left-[21px]' : 'left-[3px]'}`} />
        </button>
      );
    }

    function Card({ className = '', children }) {
      return <div className={`bg-white rounded-xl border border-line-soft shadow-[0_0_9px_rgba(103,103,103,0.08)] ${className}`}>{children}</div>;
    }

    function Badge({ className = '', children }) {
      return <span className={`inline-flex items-center px-2 py-0.5 rounded text-xs font-medium whitespace-nowrap ${className}`}>{children}</span>;
    }

    function Modal({ isOpen, onClose, title, size = 'md', children, footer }) {
      useEffect(() => {
        if (!isOpen) return;
        const onKey = (e) => e.key === 'Escape' && onClose();
        document.addEventListener('keydown', onKey);
        return () => document.removeEventListener('keydown', onKey);
      }, [isOpen, onClose]);
      if (!isOpen) return null;
      const sizes = { sm: 'max-w-sm', md: 'max-w-lg', lg: 'max-w-2xl' };
      return (
        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/40" onClick={onClose}>
          <div role="dialog" aria-modal="true" aria-labelledby="modal-title" onClick={(e) => e.stopPropagation()}
            className={`w-full ${sizes[size]} bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col max-h-[90vh]`}>
            <div className="flex items-center justify-between px-6 h-14 border-b border-line-soft shrink-0">
              <h3 id="modal-title" className="font-bold text-ink">{title}</h3>
              <button onClick={onClose} aria-label="닫기" className="text-2xl leading-none text-ink-light hover:text-ink">×</button>
            </div>
            <div className="px-6 py-5 overflow-y-auto">{children}</div>
            {footer && <div className="px-6 py-4 border-t border-line-soft bg-bg-card flex justify-end gap-2 shrink-0">{footer}</div>}
          </div>
        </div>
      );
    }

    function ConfirmModal({ isOpen, onClose, onConfirm, message }) {
      return (
        <Modal isOpen={isOpen} onClose={onClose} title="확인" size="sm"
          footer={<><Button variant="secondary" onClick={onClose}>취소</Button><Button variant="danger" onClick={onConfirm}>삭제</Button></>}>
          <p className="text-sm leading-6">{message}</p>
        </Modal>
      );
    }

    function PageHeader({ title, desc, actions }) {
      return (

            {desc && <p className="mt-1 text-sm text-ink-light">{desc}</p>}

          {actions && <div className="flex gap-2">{actions}</div>}
        </div>
      );
    }

    function EmptyRow({ colSpan, text = '데이터가 없습니다.' }) {
      return <tr><td colSpan={colSpan} className="py-16 text-center text-sm text-ink-light">{text}</td></tr>;
    }

    function Table({ head, children }) {
      return (
        <div className="overflow-x-auto">

    function SearchBar({ value, onChange, placeholder = '검색어 입력', children }) {

          {children}

              className="w-full h-10 pl-9 pr-3 rounded-md border border-line text-sm outline-none focus:border-brand" />

    function Pagination({ page, total, perPage, onChange }) {
      const pages = Math.max(1, Math.ceil(total / perPage));
      if (pages <= 1) return null;
      return (
        <nav className="flex justify-center gap-1 py-4" aria-label="페이지">

          ))}
        </nav>
      );
    }

    // ========================================
    // 🔀 Router Components
    // ========================================
    const RouterContext = createContext({ path: '/', params: {}, navigate: () => {} });
    const getHashPath = () => {
      const raw = window.location.hash.replace(/^#/, '');
      return raw.startsWith('/') ? raw.split('?')[0] : '/';
    };

    function matchRoute(pattern, path) {
      const p = pattern.split('/').filter(Boolean);
      const s = path.split('/').filter(Boolean);
      if (p.length !== s.length) return null;
      const params = {};
      for (let i = 0; i < p.length; i++) {
        if (p[i].startsWith(':')) params[p[i].slice(1)] = decodeURIComponent(s[i]);
        else if (p[i] !== s[i]) return null;
      }
      return params;
    }

    function Router({ children }) {
      const [path, setPath] = useState(getHashPath);
      useEffect(() => {
        const onChange = () => { setPath(getHashPath()); window.scrollTo(0, 0); };
        window.addEventListener('hashchange', onChange);
        return () => window.removeEventListener('hashchange', onChange);
      }, []);
      const navigate = useCallback((to) => { window.location.hash = to; }, []);
      return <RouterContext.Provider value={{ path, params: {}, navigate }}>{children}</RouterContext.Provider>;
    }
    const useRouter = () => useContext(RouterContext);
    const useParams = () => useContext(RouterContext).params;

    function Route() { return null; }
    function Routes({ children, fallback = null }) {
      const router = useRouter();
      for (const child of React.Children.toArray(children)) {
        const params = matchRoute(child.props.path, router.path);
        if (params) return <RouterContext.Provider value={{ ...router, params }}>{child.props.element}</RouterContext.Provider>;
      }
      return fallback;
    }
    function Link({ to, className = '', children, ...rest }) {
      return <a href={`#${to}`} className={className} {...rest}>{children}</a>;
    }

    // ========================================

    const PW_RULES = [
      { label: '10자 이상', test: (p) => p.length >= 10 },
      { label: '영문 대·소문자·숫자·특수문자 중 3가지 이상', test: (p) => [/[a-z]/, /[A-Z]/, /\d/, /[^A-Za-z0-9]/].filter(r => r.test(p)).length >= 3 },
      { label: '1234 · admin · makeline 같은 쉬운 단어 없음', test: (p) => p && !['1234', 'password', 'qwerty', 'admin', 'lineco', 'makeline', '0000', '1111'].some(w => p.toLowerCase().includes(w)) },
      { label: '같은 문자 4번 이상 연속 없음', test: (p) => p && !/(.)\1\1\1/.test(p) },
    ];

    function PasswordModal({ user, onClose }) {
      const toast = useToast();
      const [f, setF] = useState({ current: '', next: '', confirm: '' });
      const [error, setError] = useState('');
      const [busy, setBusy] = useState(false);
      const set = (k) => (e) => { setF({ ...f, [k]: e.target.value }); setError(''); };
      const rulesOk = PW_RULES.every(r => r.test(f.next)) && !(user?.username && f.next.toLowerCase().includes(user.username.toLowerCase()));
      const submit = async (e) => {
        e?.preventDefault();
        if (!f.current) return setError('현재 비밀번호를 입력하세요.');
        if (!rulesOk) return setError('새 비밀번호가 규칙에 맞지 않습니다.');
        if (f.next !== f.confirm) return setError('새 비밀번호 확인이 일치하지 않습니다.');
        setBusy(true);
        try {
          const r = await api('/password', { method: 'POST', body: { current: f.current, next: f.next } });
          toast(r.message || '비밀번호를 변경했습니다.');
          onClose();
        } catch (err) { setError(err.message); } finally { setBusy(false); }
      };
      return (
        <Modal isOpen onClose={onClose} title="비밀번호 변경" size="sm"
          footer={<><Button variant="secondary" onClick={onClose}>취소</Button><Button onClick={submit} disabled={busy}>{busy ? '변경 중…' : '변경'}</Button></>}>
          <form onSubmit={submit} className="space-y-4">
            {/* 브라우저 비밀번호 관리자가 아이디를 알 수 있도록 (화면에는 안 보임) */}
            <input type="text" name="username" autoComplete="username" value={user?.username || ''} readOnly hidden />
            <Input id="pw-current" type="password" label="현재 비밀번호" value={f.current} onChange={set('current')} autoComplete="current-password" />
            <Input id="pw-next" type="password" label="새 비밀번호" value={f.next} onChange={set('next')} autoComplete="new-password" />
            <ul className="space-y-1 text-xs">
              {PW_RULES.map(r => {
                const ok = r.test(f.next);
                return <li key={r.label} className={ok ? 'text-mint-deep' : 'text-ink-light'}>{ok ? '✓' : '·'} {r.label}</li>;
              })}
              <li className={f.next && !(user?.username && f.next.toLowerCase().includes(user.username.toLowerCase())) ? 'text-mint-deep' : 'text-ink-light'}>
                {f.next && !(user?.username && f.next.toLowerCase().includes(user.username.toLowerCase())) ? '✓' : '·'} 아이디가 들어가지 않음
              </li>
            </ul>
            <Input id="pw-confirm" type="password" label="새 비밀번호 확인" value={f.confirm} onChange={set('confirm')} autoComplete="new-password"
              error={f.confirm && f.confirm !== f.next ? '새 비밀번호와 다릅니다.' : ''} />
            {error && <p role="alert" className="text-sm text-danger">{error}</p>}
            <p className="text-xs text-ink-light leading-5">변경하면 다른 기기·브라우저의 관리자 로그인은 모두 해제되고, 지금 이 창은 그대로 사용할 수 있습니다.</p>
            <button type="submit" hidden />
          </form>
        </Modal>
      );
    }

    function LoginPage({ onLogin, notice }) {
      const [form, setForm] = useState({ id: '', pw: '', save: false });
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      useEffect(() => {
        try {
          const saved = localStorage.getItem('lineco_admin_saved_id');
          if (saved) setForm(f => ({ ...f, id: saved, save: true }));
        } catch {}
      }, []);

      const submit = async (e) => {
        e.preventDefault();
        if (!form.id.trim()) return setError('아이디를 입력하세요.');
        if (!form.pw) return setError('비밀번호를 입력하세요.');
        setLoading(true);
        setError('');
        try {
          const { user } = await api('/login', { method: 'POST', body: { username: form.id.trim(), password: form.pw } });
          try {
            if (form.save) localStorage.setItem('lineco_admin_saved_id', form.id.trim());
            else localStorage.removeItem('lineco_admin_saved_id');
          } catch {}
          onLogin(user);
        } catch (err) {
          setError(err.message);
          setForm(f => ({ ...f, pw: '' }));
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-5 bg-bg">
          <div className="w-full max-w-[600px] bg-white rounded-[20px] px-6 sm:px-14 py-12 shadow-[0_0_9.3px_rgba(103,103,103,0.15)]">
            <div className="text-center">

            </div>
            {notice && <p className="mt-6 px-4 py-2.5 rounded-md bg-brand/10 text-sm text-brand-600 text-center">{notice}</p>}
            <form onSubmit={submit} className="mt-10 space-y-3" noValidate>
              <Input id="p_id" label="아이디" placeholder="아이디 입력" value={form.id} autoComplete="username" disabled={loading}
                onChange={(e) => { setForm({ ...form, id: e.target.value }); setError(''); }} className="[&_label]:sr-only" />
              <Input id="p_pass" type="password" label="비밀번호" placeholder="비밀번호 입력" value={form.pw} autoComplete="current-password" disabled={loading}
                onChange={(e) => { setForm({ ...form, pw: e.target.value }); setError(''); }} className="[&_label]:sr-only" />
              <label className="flex items-center gap-2 pt-1 text-sm text-ink-mid cursor-pointer w-fit">
                <input type="checkbox" checked={form.save} onChange={(e) => setForm({ ...form, save: e.target.checked })} className="w-4 h-4 accent-[#339BFE]" />
                아이디저장
              </label>
              {error && <p role="alert" className="text-sm text-danger">{error}</p>}
              <Button type="submit" size="lg" disabled={loading} className="w-full !mt-6">{loading ? '로그인 중…' : '로그인'}</Button>
            </form>
          </div>
        </div>
      );
    }

    // ========================================
    // 📄 Page: 상담 신청 관리 (실제 DB — /api/admin/consults)
    // ========================================
    function ConsultsPage() {
      const toast = useToast();
      const [q, setQ] = useState('');
      const [status, setStatus] = useState('all');
      const [page, setPage] = useState(1);
      const [selected, setSelected] = useState(null);
      const [confirmId, setConfirmId] = useState(null);
      const [busy, setBusy] = useState(false);
      const PER = 20;
      const dq = useDebounced(q.trim());

      useEffect(() => { setPage(1); }, [dq, status]);

      const { data, loading, error, reload } = useApi('/consults', {
        q: dq, status: status === 'all' ? '' : status, page, size: PER,
      });

      const save = async (patch) => {
        setBusy(true);
        try {
          await api('/consults', { method: 'PATCH', query: { id: selected.id }, body: patch });
          setSelected(null);
          toast('저장되었습니다.');
          reload();
        } catch (e) { toast(e.message); } finally { setBusy(false); }
      };

      // 목록에서 상태 바로 변경
      const changeStatus = async (c, value) => {
        try {
          await api('/consults', { method: 'PATCH', query: { id: c.id }, body: { status: value } });
          toast(`${c.name} · ${CONSULT_STATUS[value].label}(으)로 변경했습니다.`);
          reload();
        } catch (e) { toast(e.message); }
      };

      const remove = async () => {
        setBusy(true);
        try {
          await api('/consults', { method: 'DELETE', query: { id: confirmId } });
          setConfirmId(null);
          toast('삭제되었습니다.');
          reload();
        } catch (e) { toast(e.message); } finally { setBusy(false); }
      };

      const exportCsv = async () => {
        try {
          const { items } = await api('/consults', { query: { all: '1', q: dq, status: status === 'all' ? '' : status } });
          const rows = [['번호', '이름', '연락처', '상담내용', '신청일', '상태', '메모'],
            ...items.map(c => [c.id, c.name, c.phone, c.content || '', fmtDate(c.created_at, true), CONSULT_STATUS[c.status].label, c.memo || ''])];
          const csv = '﻿' + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
          const a = document.createElement('a');
          a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
          a.download = `상담신청_${fmtDate(today.toISOString())}.csv`;
          a.click();
          URL.revokeObjectURL(a.href);
        } catch (e) { toast(e.message); }
      };

      const s = data?.summary;
      const tabs = [{ value: 'all', label: '전체', n: s?.all }, ...Object.entries(CONSULT_STATUS).map(([v, c]) => ({ value: v, label: c.label, n: s?.[v] }))];

      return (
        <>
          <PageHeader title="상담 신청" desc="홈페이지 하단 '비대면 처방 / 진료상담 신청' 접수 내역 (실시간 DB)"
            actions={<>
              <Button variant="secondary" onClick={reload}>새로고침</Button>
              <Button variant="secondary" onClick={exportCsv}>엑셀(CSV) 다운로드</Button>
            </>} />
          <Card>
            <div className="flex flex-wrap gap-1 px-4 pt-4" role="tablist" aria-label="처리 상태">
              {tabs.map(t => (
                <button key={t.value} role="tab" aria-selected={status === t.value} onClick={() => setStatus(t.value)}
                  className={`h-9 px-3.5 rounded-full text-sm transition-colors ${status === t.value ? 'bg-brand text-white' : 'bg-bg text-ink-mid hover:bg-line-soft'}`}>
                  {t.label} <span className="opacity-70">{t.n ?? ''}</span>
                </button>
              ))}
            </div>
            <SearchBar value={q} onChange={setQ} placeholder="이름 · 연락처 · 상담내용 검색" />
            {loading && !data ? <Spinner /> : error ? <ErrorBox error={error} onRetry={reload} /> : (
              <div className={loading ? 'opacity-60 transition-opacity' : ''}>
                <Table head={['번호', '상태', '이름', '연락처', '상담내용', '신청일', '관리']}>
                  {data.items.length === 0 ? <EmptyRow colSpan={7} text={dq || status !== 'all' ? '조건에 맞는 상담 신청이 없습니다.' : '아직 접수된 상담 신청이 없습니다.'} /> : data.items.map(c => (
                    <tr key={c.id} className="hover:bg-bg-card">
                      <td className="px-4 py-3 text-ink-light">{c.id}</td>
                      <td className="px-4 py-3"><StatusPicker consult={c} onChange={changeStatus} /></td>
                      <td className="px-4 py-3 font-medium whitespace-nowrap">{c.name}{c.source === 'makeline_legacy' && <Badge className="ml-1.5 bg-ink/5 text-ink-light">기존</Badge>}</td>
                      <td className="px-4 py-3 whitespace-nowrap"><a href={`tel:${c.phone}`} className="hover:text-brand">{c.phone}</a></td>
                      <td className="px-4 py-3 max-w-[320px] truncate">{c.content || '-'}{c.memo && <span className="ml-2 text-xs text-mint-deep">📝</span>}</td>
                      <td className="px-4 py-3 whitespace-nowrap text-ink-light">{fmtDate(c.created_at, true)}</td>
                      <td className="px-4 py-3 whitespace-nowrap">
                        <Button size="sm" variant="secondary" onClick={() => setSelected(c)}>상세</Button>
                        <Button size="sm" variant="ghost" onClick={() => setConfirmId(c.id)} className="hover:!text-danger">삭제</Button>
                      </td>
                    </tr>
                  ))}
                </Table>
                <Pagination page={page} total={data.total} perPage={PER} onChange={setPage} />
              </div>
            )}
          </Card>

          {selected && <ConsultDetail consult={selected} busy={busy} onClose={() => setSelected(null)} onSave={save} />}
          <ConfirmModal isOpen={confirmId !== null} onClose={() => setConfirmId(null)} onConfirm={remove}
            message="이 상담 신청을 삭제할까요? 삭제 후에는 되돌릴 수 없습니다." />
        </>
      );
    }

    // 상태 배지를 누르면 바로 아래에 상태 목록이 떠서 한 번에 변경
    // (표가 가로 스크롤 영역 안이라 잘리지 않도록 화면 기준 fixed 로 띄움)
    function StatusPicker({ consult, onChange }) {
      const [pos, setPos] = useState(null);
      const [saving, setSaving] = useState(false);
      const cur = CONSULT_STATUS[consult.status];
      useEffect(() => {
        if (!pos) return;
        const close = () => setPos(null);
        const onKey = (e) => e.key === 'Escape' && close();
        window.addEventListener('scroll', close, true);
        window.addEventListener('resize', close);
        document.addEventListener('keydown', onKey);
        return () => { window.removeEventListener('scroll', close, true); window.removeEventListener('resize', close); document.removeEventListener('keydown', onKey); };
      }, [pos]);
      const open = (e) => {
        const r = e.currentTarget.getBoundingClientRect();
        const menuH = 4 * 36 + 12;
        const up = r.bottom + menuH > window.innerHeight; // 화면 아래쪽이면 위로 띄움
        setPos({ left: r.left, top: up ? r.top - menuH - 4 : r.bottom + 4 });
      };
      const pick = async (value) => {
        setPos(null);
        if (value === consult.status) return;
        setSaving(true);
        await onChange(consult, value);
        setSaving(false);
      };
      return (
        <>
          <button type="button" onClick={(e) => (pos ? setPos(null) : open(e))} disabled={saving} aria-haspopup="listbox" aria-expanded={!!pos}
            aria-label={`처리 상태: ${cur.label} (눌러서 변경)`}
            className={`inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-medium whitespace-nowrap cursor-pointer ring-1 ring-transparent hover:ring-brand/40 transition ${cur.cls} ${saving ? 'opacity-50' : ''}`}>
            {saving ? '저장 중…' : cur.label}<span className="text-[9px] opacity-60" aria-hidden="true">▾</span>
          </button>
          {pos && (
            <>
              <div className="fixed inset-0 z-[120]" onClick={() => setPos(null)} />
              <ul role="listbox" aria-label="처리 상태 선택" style={{ left: pos.left, top: pos.top }}
                className="fixed z-[121] min-w-[120px] py-1.5 bg-white rounded-lg border border-line-soft shadow-[0_8px_24px_rgba(0,0,0,0.14)]">
                {Object.entries(CONSULT_STATUS).map(([v, s]) => (
                  <li key={v}>
                    <button type="button" role="option" aria-selected={v === consult.status} onClick={() => pick(v)}
                      className={`w-full h-9 px-3 flex items-center justify-between gap-3 text-sm hover:bg-bg ${v === consult.status ? 'font-medium' : ''}`}>
                      <Badge className={s.cls}>{s.label}</Badge>
                      {v === consult.status && <span className="text-brand text-xs" aria-hidden="true">✓</span>}
                    </button>
                  </li>
                ))}
              </ul>
            </>
          )}
        </>
      );
    }

    function ConsultDetail({ consult, busy, onClose, onSave }) {
      const [status, setStatus] = useState(consult.status);
      const [memo, setMemo] = useState(consult.memo || '');
      return (
        <Modal isOpen onClose={onClose} title={`상담 신청 #${consult.id}`}
          footer={<><Button variant="secondary" onClick={onClose}>닫기</Button><Button disabled={busy} onClick={() => onSave({ status, memo })}>{busy ? '저장 중…' : '저장'}</Button></>}>
          <dl className="grid grid-cols-[80px_1fr] gap-y-3 text-sm">
            <dt className="text-ink-light">이름</dt><dd className="font-medium">{consult.name}</dd>
            <dt className="text-ink-light">연락처</dt><dd><a href={`tel:${consult.phone}`} className="text-brand">{consult.phone}</a></dd>
            <dt className="text-ink-light">신청일</dt><dd>{fmtDate(consult.created_at, true)}</dd>
            <dt className="text-ink-light">상담내용</dt><dd className="whitespace-pre-wrap">{consult.content || '-'}</dd>
            {consult.updated_at !== consult.created_at && <><dt className="text-ink-light">최종 수정</dt><dd>{fmtDate(consult.updated_at, true)}</dd></>}
          </dl>
          <div className="mt-6 space-y-4">
            <Select id="detail-status" label="처리 상태" value={status} onChange={(e) => setStatus(e.target.value)}
              options={Object.entries(CONSULT_STATUS).map(([v, s]) => ({ value: v, label: s.label }))} />
            <Textarea id="detail-memo" label="관리자 메모" value={memo} onChange={(e) => setMemo(e.target.value)} placeholder="연락 내용, 예약 일정 등" />
          </div>
        </Modal>
      );
    }

    // ========================================
    // 📄 Page: 회원 관리 (실제 DB: /api/admin/records?type=members)
    // ========================================
    // 목록 공용: 검색어(디바운스) · 페이지 · 다시 불러오기
    function useRecordList(type, size = 50) {
      const [q, setQ] = useState('');
      const [page, setPage] = useState(1);
      const dq = useDebounced(q);
      useEffect(() => { setPage(1); }, [dq]);
      const res = useApi('/records', { type, q: dq, page, size });
      return { ...res, q, setQ, page, setPage, size, items: res.data?.items || [], total: res.data?.total || 0 };
    }
    const LegacyBadge = () => <Badge className="bg-ink/5 text-ink-light">기존 사이트</Badge>;

    function MembersPage() {
      const toast = useToast();
      const L = useRecordList('members');
      const [memo, setMemo] = useState(null);
      const [confirmId, setConfirmId] = useState(null);
      const saveMemo = async () => {
        try { await api('/records', { method: 'PATCH', query: { type: 'members', id: memo.id }, body: { memo: memo.memo || '' } }); toast('메모를 저장했습니다.'); setMemo(null); L.reload(); }
        catch (e) { toast(e.message); }
      };
      const remove = async () => {
        try { await api('/records', { method: 'DELETE', query: { type: 'members', id: confirmId } }); toast('삭제했습니다.'); setConfirmId(null); L.reload(); }
        catch (e) { toast(e.message); }
      };
      return (
        <>
          <PageHeader title="회원 관리" desc={`전체 ${L.total.toLocaleString('ko-KR')}명 · 기존 홈페이지 회원 정보(비밀번호 제외)`} />
          <Card>
            <SearchBar value={L.q} onChange={L.setQ} placeholder="아이디 · 이메일 · 이름 · 연락처 검색" />
            {L.loading && !L.items.length ? <Spinner /> : L.error ? <ErrorBox error={L.error} onRetry={L.reload} /> : (
              <Table head={['번호', '아이디', '이메일', '이름', '연락처', '가입일', '가입 IP', '메모', '관리']}>
                {L.items.length === 0 ? <EmptyRow colSpan={9} text={L.q ? '검색 결과가 없습니다.' : '회원이 없습니다.'} /> : L.items.map((m, i) => (
                  <tr key={m.id} className="hover:bg-bg-card">
                    <td className="px-4 py-3 text-ink-light">{L.total - (L.page - 1) * L.size - i}</td>
                    <td className="px-4 py-3 font-medium">{m.user_id || '-'} {m.source === 'makeline_legacy' && <LegacyBadge />}</td>
                    <td className="px-4 py-3 text-ink-mid">{m.email || '-'}</td>
                    <td className="px-4 py-3">{m.name || '-'}</td>
                    <td className="px-4 py-3 whitespace-nowrap">{m.phone || '-'}</td>
                    <td className="px-4 py-3 whitespace-nowrap text-ink-light">{fmtDate(m.joined_at, true)}</td>
                    <td className="px-4 py-3 whitespace-nowrap text-ink-light">{m.join_ip || '-'}</td>
                    <td className="px-4 py-3 max-w-[200px] truncate text-ink-mid">{m.memo || ''}</td>
                    <td className="px-4 py-3 whitespace-nowrap">
                      <Button size="sm" variant="secondary" onClick={() => setMemo({ id: m.id, name: m.name || m.user_id, memo: m.memo || '' })}>메모</Button>
                      <Button size="sm" variant="ghost" onClick={() => setConfirmId(m.id)} className="hover:!text-danger">삭제</Button>
                    </td>
                  </tr>
                ))}
              </Table>
            )}
            <Pagination page={L.page} total={L.total} perPage={L.size} onChange={L.setPage} />
          </Card>
          <Modal isOpen={!!memo} onClose={() => setMemo(null)} title={`회원 메모 · ${memo?.name || ''}`}
            footer={<><Button variant="secondary" onClick={() => setMemo(null)}>취소</Button><Button onClick={saveMemo}>저장</Button></>}>
            {memo && <Textarea id="mb-memo" label="관리자 메모" value={memo.memo} onChange={(e) => setMemo({ ...memo, memo: e.target.value })} rows={4} />}
          </Modal>
          <ConfirmModal isOpen={confirmId !== null} onClose={() => setConfirmId(null)} message="이 회원 정보를 삭제할까요? 되돌릴 수 없습니다." onConfirm={remove} />
        </>
      );
    }

    // ========================================
    // 📄 Page: 치료후기 — 실시간 리뷰 / 전후사진 (실제 DB)
    // ========================================
    function Stars({ n }) {
      const v = Math.max(0, Math.min(5, Number(n) || 0));
      return <span className="text-amber-400 tracking-tight" aria-label={`별점 ${v}점`}>{'★'.repeat(v)}<span className="text-line">{'★'.repeat(5 - v)}</span></span>;
    }

    function ReviewsPage() {
      const toast = useToast();
      const L = useRecordList('reviews');
      const [view, setView] = useState(null);
      const [confirmId, setConfirmId] = useState(null);
      const toggle = async (r, v) => {
        try { await api('/records', { method: 'PATCH', query: { type: 'reviews', id: r.id }, body: { visible: v } }); toast(v ? '공개했습니다.' : '비공개 처리했습니다.'); L.reload(); }
        catch (e) { toast(e.message); }
      };
      const remove = async () => {
        try { await api('/records', { method: 'DELETE', query: { type: 'reviews', id: confirmId } }); toast('삭제했습니다.'); setConfirmId(null); L.reload(); }
        catch (e) { toast(e.message); }
      };
      return (
        <>
          <PageHeader title="실시간 리뷰" desc={`전체 ${L.total.toLocaleString('ko-KR')}건 · 의료법에 따라 홈페이지에 공개할 때는 주의가 필요합니다.`} />
          <Card>
            <SearchBar value={L.q} onChange={L.setQ} placeholder="상품 · 내용 검색" />
            {L.loading && !L.items.length ? <Spinner /> : L.error ? <ErrorBox error={L.error} onRetry={L.reload} /> : (
              <Table head={['번호', '상품', '평점', '성별/연령', '내용', '등록일', '공개', '관리']}>
                {L.items.length === 0 ? <EmptyRow colSpan={8} text={L.q ? '검색 결과가 없습니다.' : '리뷰가 없습니다.'} /> : L.items.map((r, i) => (
                  <tr key={r.id} className="hover:bg-bg-card">
                    <td className="px-4 py-3 text-ink-light">{L.total - (L.page - 1) * L.size - i}</td>
                    <td className="px-4 py-3 font-medium whitespace-nowrap">{r.product || '-'}</td>
                    <td className="px-4 py-3">{r.rating != null ? <Stars n={r.rating} /> : '-'}</td>
                    <td className="px-4 py-3 whitespace-nowrap">{[r.gender, r.age_group].filter(Boolean).join(' · ') || '-'}</td>
                    <td className="px-4 py-3 max-w-[360px] truncate text-ink-mid">{r.content}</td>
                    <td className="px-4 py-3 whitespace-nowrap text-ink-light">{fmtDate(r.written_at)}</td>
                    <td className="px-4 py-3"><Toggle label="공개 여부" checked={r.visible} onChange={(v) => toggle(r, v)} /></td>
                    <td className="px-4 py-3 whitespace-nowrap">
                      <Button size="sm" variant="secondary" onClick={() => setView(r)}>보기</Button>
                      <Button size="sm" variant="ghost" onClick={() => setConfirmId(r.id)} className="hover:!text-danger">삭제</Button>
                    </td>
                  </tr>
                ))}
              </Table>
            )}
            <Pagination page={L.page} total={L.total} perPage={L.size} onChange={L.setPage} />
          </Card>
          <Modal isOpen={!!view} onClose={() => setView(null)} title="리뷰 내용">
            {view && (
              <>
                <p className="text-sm text-ink-light">{[view.product, view.gender, view.age_group, fmtDate(view.written_at)].filter(Boolean).join(' · ')}</p>
                {view.rating != null && <p className="mt-1"><Stars n={view.rating} /></p>}
                {view.image && <img src={imgSrc(view.image)} alt="" className="mt-4 max-h-64 rounded" />}
                <p className="mt-4 text-sm leading-7 whitespace-pre-wrap">{view.content}</p>
              </>
            )}
          </Modal>
          <ConfirmModal isOpen={confirmId !== null} onClose={() => setConfirmId(null)} message="이 리뷰를 삭제할까요?" onConfirm={remove} />
        </>
      );
    }

    function PhotosPage() {
      const toast = useToast();
      const L = useRecordList('photos', 24);
      const [view, setView] = useState(null);
      const [confirmId, setConfirmId] = useState(null);
      const patch = async (p, body, msg) => {
        try { await api('/records', { method: 'PATCH', query: { type: 'photos', id: p.id }, body }); toast(msg); L.reload(); if (view?.id === p.id) setView({ ...view, ...body }); }
        catch (e) { toast(e.message); }
      };
      const remove = async () => {
        try { await api('/records', { method: 'DELETE', query: { type: 'photos', id: confirmId } }); toast('삭제했습니다.'); setConfirmId(null); setView(null); L.reload(); }
        catch (e) { toast(e.message); }
      };
      const thumb = (p) => p.list_image || p.images?.[0]?.url;
      return (
        <>
          <PageHeader title="전후사진" desc={`전체 ${L.total.toLocaleString('ko-KR')}건 · 의료광고 기준상 홈페이지 공개는 꺼져 있으며, 환자 동의 확인 후에만 공개할 수 있습니다.`} />
          <Card className="mb-4"><SearchBar value={L.q} onChange={L.setQ} placeholder="제목 · 관리부위 검색" /></Card>
          {L.loading && !L.items.length ? <Card><Spinner /></Card> : L.error ? <Card><ErrorBox error={L.error} onRetry={L.reload} /></Card> : L.items.length === 0 ? (
            <Card className="py-20 text-center text-sm text-ink-light">{L.q ? '검색 결과가 없습니다.' : '등록된 사진이 없습니다.'}</Card>
          ) : (
            <div className="grid sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
              {L.items.map(p => (
                <Card key={p.id} className="overflow-hidden">
                  <button type="button" onClick={() => setView(p)} className="block w-full aspect-[4/3] bg-bg overflow-hidden">
                    {thumb(p) ? <img src={imgSrc(thumb(p))} alt="" className="w-full h-full object-cover" loading="lazy" /> : <span className="text-xs text-ink-light">이미지 없음</span>}
                  </button>
                  <div className="p-4">
                    <div className="flex flex-wrap items-center gap-1.5">
                      {p.area && <Badge className="bg-brand/10 text-brand-600">{p.area}</Badge>}
                      <Badge className={p.consent ? 'bg-mint/20 text-mint-deep' : 'bg-danger/10 text-danger'}>{p.consent ? '동의 확인' : '동의 미확인'}</Badge>
                      <Badge className={p.visible ? 'bg-mint/20 text-mint-deep' : 'bg-ink/10 text-ink-mid'}>{p.visible ? '공개' : '비공개'}</Badge>
                    </div>
                    <h3 className="mt-2 font-medium truncate">{p.title || '(제목 없음)'}</h3>
                    <p className="text-xs text-ink-light">{fmtDate(p.written_at)} · 사진 {p.images?.length || 0}장 · {[p.gender, p.age].filter(Boolean).join(' ')}</p>
                    <div className="mt-3 flex gap-2">
                      <Button size="sm" variant="secondary" onClick={() => setView(p)}>보기</Button>
                      <Button size="sm" variant="ghost" onClick={() => setConfirmId(p.id)} className="hover:!text-danger">삭제</Button>
                    </div>
                  </div>
                </Card>
              ))}
            </div>
          )}
          <div className="mt-4"><Pagination page={L.page} total={L.total} perPage={L.size} onChange={L.setPage} /></div>
          <Modal isOpen={!!view} onClose={() => setView(null)} title={view?.title || '전후사진'} size="lg">
            {view && (
              <div className="space-y-4">
                <p className="text-sm text-ink-light">{[view.content_title, view.gender, view.age, view.height, view.area, fmtDate(view.written_at)].filter(Boolean).join(' · ')}</p>
                <div className="grid grid-cols-2 gap-2">
                  {(view.images || []).map((im, i) => (
                    <figure key={i}>
                      <img src={imgSrc(im.url)} alt={im.label || ''} className="w-full rounded border border-line-soft" loading="lazy" />
                      {im.label && <figcaption className="mt-1 text-xs text-ink-light">{im.label}</figcaption>}
                    </figure>
                  ))}
                </div>
                <div className="flex flex-col gap-3 text-sm border-t border-line-soft pt-4">
                  <label className="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" checked={!!view.consent} onChange={(e) => patch(view, { consent: e.target.checked }, e.target.checked ? '동의 확인으로 표시했습니다.' : '동의 미확인으로 표시했습니다.')} className="w-4 h-4 accent-[#339BFE]" />
                    환자 사진 게시 동의서를 확인했습니다
                  </label>
                  <div className="flex items-center gap-3"><Toggle label="홈페이지 공개" checked={!!view.visible} onChange={(v) => patch(view, { visible: v }, v ? '공개했습니다.' : '비공개 처리했습니다.')} /> 홈페이지 공개 (동의 확인 후에만 가능)</div>
                </div>
              </div>
            )}
          </Modal>
          <ConfirmModal isOpen={confirmId !== null} onClose={() => setConfirmId(null)} message="이 전후사진을 삭제할까요?" onConfirm={remove} />
        </>
      );
    }

    // ========================================
    // 🖼️ 팝업 · 이벤트 공용 (실제 DB: /api/admin/content)
    // ========================================
    // 팝업 클릭 시 이동할 수 있는 홈페이지 메뉴
    const SITE_PAGES = [
      { value: '/', label: '홈' },
      { value: '/introduction', label: '라인앤코 · 소개' },
      { value: '/space', label: '라인앤코 · 공간 둘러보기' },
      { value: '/location', label: '라인앤코 · 오시는 길' },
      { value: '/makeline_diet', label: '메이크라인 다이어트' },
      { value: '/program/shading', label: '프로그램 · 쉐딩 패키지' },
      { value: '/program/yeori', label: '프로그램 · 여리 패키지' },
      { value: '/program/face-balance', label: '프로그램 · 바로 패키지' },
      { value: '/program/bride', label: '프로그램 · 예비신부 패키지' },
      { value: '/program/shoulder', label: '바디컨투어링 · 승모 슬림' },
      { value: '/program/arm', label: '바디컨투어링 · 팔뚝 슬림' },
      { value: '/program/belly', label: '바디컨투어링 · 복부 슬림' },
      { value: '/program/hip', label: '바디컨투어링 · 힙 라인 업' },
      { value: '/program/thigh', label: '바디컨투어링 · 허벅지 슬림' },
      { value: '/program/calf', label: '바디컨투어링 · 종아리 슬림' },
      { value: '/face/nose', label: '페이스&스킨 · 코프팅' },
      { value: '/face/vline', label: '페이스&스킨 · 브이라인 리프팅' },
      { value: '/face/asymmetry', label: '페이스&스킨 · 안면비대칭' },
      { value: '/face/volumer', label: '페이스&스킨 · 볼류머샷' },
      { value: '/face/whitening', label: '페이스&스킨 · 미백주사' },
      { value: '/event', label: '이벤트 목록' },
    ];
    const LINK_TYPE_OPTIONS = [
      { value: 'page', label: '홈페이지 메뉴로 이동' },
      { value: 'event', label: '이벤트 상세로 이동' },
      { value: 'url', label: '외부 링크 (새 창)' },
      { value: 'none', label: '이동 없음' },
    ];

    // 미리보기용 이미지 주소 (원본 사이트 경로 · 업로드 이미지 · 외부 URL)
    const imgSrc = (v) => (!v ? '' : v.startsWith('/UPLOAD/') ? 'images/upload/' + v.slice('/UPLOAD/'.length) : v);

    // 오늘(한국 시간) 기준 노출 상태
    const kstToday = () => new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 10);
    function liveStatus(item) {
      const t = kstToday();
      if (!item.visible) return { label: '숨김', cls: 'bg-line text-ink-mid' };
      if (item.start_date && item.start_date > t) return { label: '예정', cls: 'bg-brand/10 text-brand-600' };
      if (item.end_date && item.end_date < t) return { label: '종료', cls: 'bg-ink/10 text-ink-mid' };
      return { label: '노출 중', cls: 'bg-mint/20 text-mint-deep' };
    }
    const fmtPeriod = (s, e) => (s || e ? `${s || '-'} ~ ${e || '-'}` : '상시');

    // 업로드 전에 브라우저에서 줄이기 (긴 변 1600px, JPEG) — GIF는 움직임 유지를 위해 그대로
    function readImage(file) {
      return new Promise((resolve, reject) => {
        if (!/^image\/(jpeg|png|webp|gif)$/.test(file.type)) return reject(new Error('JPG · PNG · WEBP · GIF 이미지만 올릴 수 있습니다.'));
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('파일을 읽지 못했습니다.'));
        reader.onload = () => {
          if (file.type === 'image/gif') {
            if (file.size > 3 * 1024 * 1024) return reject(new Error('GIF는 3MB 이하만 올릴 수 있습니다.'));
            return resolve({ mime: file.type, data: reader.result });
          }
          const im = new Image();
          im.onerror = () => reject(new Error('이미지를 열 수 없습니다.'));
          im.onload = () => {
            const scale = Math.min(1, 1600 / Math.max(im.width, im.height));
            const c = document.createElement('canvas');
            c.width = Math.round(im.width * scale); c.height = Math.round(im.height * scale);
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); // 투명 배경은 흰색으로
            ctx.drawImage(im, 0, 0, c.width, c.height);
            resolve({ mime: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.88) });
          };
          im.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function ImageField({ id, label, value, onChange, hint }) {
      const toast = useToast();
      const [busy, setBusy] = useState(false);
      const onFile = async (e) => {
        const file = e.target.files?.[0];
        e.target.value = '';
        if (!file) return;
        setBusy(true);
        try {
          const payload = await readImage(file);
          const r = await api('/content', { method: 'POST', query: { type: 'image' }, body: payload });
          onChange(r.url);
          toast('이미지를 올렸습니다. 저장을 눌러야 반영됩니다.');
        } catch (err) {
          toast(err.message);
        } finally {
          setBusy(false);
        }
      };
      return (
        <div>
          <label htmlFor={id} className="block mb-1.5 text-[13px] font-medium text-ink-mid">{label}</label>
          <div className="flex gap-3 items-start">
            <div className="w-28 aspect-[4/3] shrink-0 rounded-md border border-line bg-bg overflow-hidden flex items-center justify-center">
              {value ? <img src={imgSrc(value)} alt="미리보기" className="w-full h-full object-contain" /> : <span className="text-xs text-ink-light">이미지 없음</span>}
            </div>
            <div className="flex-1 min-w-0 space-y-2">
              <label className={`inline-flex items-center justify-center h-9 px-3 rounded-md border text-sm cursor-pointer ${busy ? 'opacity-50 pointer-events-none' : 'border-line hover:border-brand hover:text-brand'}`}>
                {busy ? '올리는 중…' : '이미지 파일 올리기'}
                <input type="file" accept="image/jpeg,image/png,image/webp,image/gif" onChange={onFile} className="sr-only" />
              </label>
              <input id={id} value={value || ''} onChange={(e) => onChange(e.target.value)} placeholder="또는 https:// 이미지 주소 붙여넣기"
                className="w-full h-9 px-3 rounded-md border border-line bg-white text-xs outline-none focus:border-brand" />
              {hint && <p className="text-xs text-ink-light">{hint}</p>}
            </div>
          </div>
        </div>
      );
    }

    // 목록 화면 공용: 불러오기 · 노출 토글 · 삭제
    function useContentList(type) {
      const res = useApi('/content', { type });
      const toast = useToast();
      const patch = async (id, body, msg) => {
        try { await api('/content', { method: 'PATCH', query: { type, id }, body }); if (msg) toast(msg); res.reload(); }
        catch (e) { toast(e.message); }
      };
      const remove = async (id) => {
        try { await api('/content', { method: 'DELETE', query: { type, id } }); toast('삭제되었습니다.'); res.reload(); }
        catch (e) { toast(e.message); }
      };
      return { ...res, items: res.data?.items || [], patch, remove };
    }

    function SiteDelayNote() {
      return <p className="mt-3 text-xs text-ink-light">※ 저장한 내용은 홈페이지에 1분 안에 반영됩니다. 시작일·종료일은 한국 날짜 기준이며 비워 두면 상시 노출됩니다.</p>;
    }

    // ========================================
    // 📄 Page: 이벤트 관리 (홈페이지 '이벤트' 메뉴)
    // ========================================
    function EventsPage() {
      const toast = useToast();
      const { items, loading, error, reload, patch, remove } = useContentList('events');
      const [editing, setEditing] = useState(null);
      const [confirmId, setConfirmId] = useState(null);
      const empty = { title: '', price: 0, image: '', description: '', start_date: '', end_date: '', visible: true, sort: (items.length ? Math.max(...items.map(i => i.sort)) + 1 : 0) };

      const save = async (f) => {
        if (!f.title.trim()) return toast('이벤트명을 입력하세요.');
        if (f.start_date && f.end_date && f.start_date > f.end_date) return toast('종료일이 시작일보다 빠릅니다.');
        const body = { title: f.title, price: Number(f.price) || 0, image: f.image || '', description: f.description || '', start_date: f.start_date || '', end_date: f.end_date || '', visible: !!f.visible, sort: Number(f.sort) || 0 };
        try {
          if (f.id) await api('/content', { method: 'PATCH', query: { type: 'events', id: f.id }, body });
          else await api('/content', { method: 'POST', query: { type: 'events' }, body });
          setEditing(null); toast('저장되었습니다.'); reload();
        } catch (e) { toast(e.message); }
      };

      return (
        <>
          <PageHeader title="이벤트" desc="홈페이지 '이벤트' 메뉴에 올라가는 이벤트 (팝업과 별도로 관리)"
            actions={<Button onClick={() => setEditing(empty)}>+ 이벤트 등록</Button>} />
          <Card>
            {loading && !items.length ? <Spinner /> : error ? <ErrorBox error={error} onRetry={reload} /> : (
              <Table head={['순서', '이미지', '이벤트명', '가격', '기간', '상태', '노출', '관리']}>
                {items.length === 0 ? <EmptyRow colSpan={8} text="등록된 이벤트가 없습니다." /> : items.map(ev => {
                  const st = liveStatus(ev);
                  return (
                    <tr key={ev.id} className="hover:bg-bg-card">
                      <td className="px-4 py-3 text-ink-light">{ev.sort}</td>
                      <td className="px-4 py-3">
                        <div className="w-20 aspect-[350/250] rounded bg-bg overflow-hidden">
                          {ev.image && <img src={imgSrc(ev.image)} alt="" className="w-full h-full object-cover" loading="lazy" />}
                        </div>
                      </td>
                      <td className="px-4 py-3 font-medium">
                        {ev.title}
                        <a href={`index.html#/event/${ev.id}`} target="_blank" rel="noopener noreferrer" className="ml-2 text-xs text-brand hover:underline">보기 ↗</a>
                      </td>
                      <td className="px-4 py-3 whitespace-nowrap">{won(ev.price)}</td>
                      <td className="px-4 py-3 whitespace-nowrap text-ink-light">{fmtPeriod(ev.start_date, ev.end_date)}</td>
                      <td className="px-4 py-3"><Badge className={st.cls}>{st.label}</Badge></td>
                      <td className="px-4 py-3"><Toggle label="노출" checked={ev.visible} onChange={(v) => patch(ev.id, { visible: v }, v ? '노출합니다.' : '숨겼습니다.')} /></td>
                      <td className="px-4 py-3 whitespace-nowrap">
                        <Button size="sm" variant="secondary" onClick={() => setEditing({ ...ev, start_date: ev.start_date || '', end_date: ev.end_date || '', description: ev.description || '', image: ev.image || '' })}>수정</Button>
                        <Button size="sm" variant="ghost" onClick={() => setConfirmId(ev.id)} className="hover:!text-danger">삭제</Button>
                      </td>
                    </tr>
                  );
                })}
              </Table>
            )}
          </Card>
          <SiteDelayNote />
          {editing && <EventForm initial={editing} onClose={() => setEditing(null)} onSave={save} />}
          <ConfirmModal isOpen={confirmId !== null} onClose={() => setConfirmId(null)}
            message="이 이벤트를 삭제할까요? 이 이벤트로 연결된 팝업은 '이동 없음'으로 바뀝니다."
            onConfirm={() => { remove(confirmId); setConfirmId(null); }} />
        </>
      );
    }

    function EventForm({ initial, onClose, onSave }) {
      const [f, setF] = useState(initial);
      const [saving, setSaving] = useState(false);
      const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
      const submit = async () => { setSaving(true); await onSave(f); setSaving(false); };
      return (
        <Modal isOpen onClose={onClose} title={f.id ? '이벤트 수정' : '이벤트 등록'} size="lg"
          footer={<><Button variant="secondary" onClick={onClose}>취소</Button><Button onClick={submit} disabled={saving}>{saving ? '저장 중…' : '저장'}</Button></>}>
          <div className="space-y-4">
            <Input id="ev-title" label="이벤트명" value={f.title} onChange={set('title')} maxLength={100} />
            <ImageField id="ev-image" label="대표 이미지" value={f.image} onChange={(v) => setF({ ...f, image: v })} hint="목록 카드는 가로 350:250 비율로 잘려 보이고, 상세 페이지에는 원본 비율로 크게 표시됩니다." />
            <div className="grid grid-cols-2 gap-3">
              <Input id="ev-price" type="number" min="0" label="가격 (0이면 '가격 상담')" value={f.price} onChange={set('price')} />
              <Input id="ev-sort" type="number" label="노출 순서 (작을수록 앞)" value={f.sort} onChange={set('sort')} />
            </div>
            <Textarea id="ev-desc" label="상세 설명 (선택 · 이벤트 상세 페이지에 표시)" value={f.description} onChange={set('description')} rows={5} placeholder="이벤트 내용, 대상, 유의사항 등" />
            <div className="grid grid-cols-2 gap-3">
              <Input id="ev-start" type="date" label="시작일 (비우면 바로)" value={f.start_date} onChange={set('start_date')} />
              <Input id="ev-end" type="date" label="종료일 (비우면 상시)" value={f.end_date} onChange={set('end_date')} />
            </div>
            <div className="flex items-center gap-3 text-sm"><Toggle label="노출" checked={f.visible} onChange={(v) => setF({ ...f, visible: v })} /> 홈페이지 이벤트 메뉴에 노출</div>
          </div>
        </Modal>
      );
    }

    // ========================================
    // 📄 Page: 팝업 관리 (홈 첫 화면 팝업, 여러 개면 슬라이드)
    // ========================================
    function PopupsPage() {
      const toast = useToast();
      const { items, loading, error, reload, patch, remove } = useContentList('popups');
      const events = useApi('/content', { type: 'events' });
      const eventList = events.data?.items || [];
      const [editing, setEditing] = useState(null);
      const [confirmId, setConfirmId] = useState(null);
      const empty = { title: '', image: '', link_type: 'page', link_target: '/', start_date: '', end_date: '', visible: true, sort: (items.length ? Math.max(...items.map(i => i.sort)) + 1 : 0) };

      const linkLabel = (p) => {
        if (p.link_type === 'page') return `메뉴 · ${(SITE_PAGES.find(s => s.value === p.link_target) || {}).label || p.link_target}`;
        if (p.link_type === 'event') return `이벤트 · ${(eventList.find(e => String(e.id) === String(p.link_target)) || {}).title || `#${p.link_target}`}`;
        if (p.link_type === 'url') return `외부 · ${p.link_target}`;
        return '이동 없음';
      };

      const save = async (f) => {
        if (!f.title.trim()) return toast('팝업 제목을 입력하세요.');
        if (!f.image) return toast('팝업 이미지를 올려주세요.');
        if (f.start_date && f.end_date && f.start_date > f.end_date) return toast('종료일이 시작일보다 빠릅니다.');
        const body = { title: f.title, image: f.image, link_type: f.link_type, link_target: f.link_type === 'none' ? '' : String(f.link_target || ''), start_date: f.start_date || '', end_date: f.end_date || '', visible: !!f.visible, sort: Number(f.sort) || 0 };
        try {
          if (f.id) await api('/content', { method: 'PATCH', query: { type: 'popups', id: f.id }, body });
          else await api('/content', { method: 'POST', query: { type: 'popups' }, body });
          setEditing(null); toast('저장되었습니다.'); reload();
        } catch (e) { toast(e.message); }
      };

      return (
        <>
          <PageHeader title="팝업 관리" desc="홈페이지 첫 화면에 뜨는 팝업 (여러 개면 순서대로 슬라이드) · 클릭하면 지정한 메뉴·이벤트·링크로 이동"
            actions={<Button onClick={() => setEditing(empty)}>+ 팝업 등록</Button>} />
          <Card>
            {loading && !items.length ? <Spinner /> : error ? <ErrorBox error={error} onRetry={reload} /> : (
              <Table head={['순서', '이미지', '제목', '클릭 시 이동', '기간', '상태', '노출', '관리']}>
                {items.length === 0 ? <EmptyRow colSpan={8} text="등록된 팝업이 없습니다." /> : items.map(p => {
                  const st = liveStatus(p);
                  return (
                    <tr key={p.id} className="hover:bg-bg-card">
                      <td className="px-4 py-3 text-ink-light">{p.sort}</td>
                      <td className="px-4 py-3">
                        <div className="w-24 aspect-[16/9] rounded bg-bg overflow-hidden">
                          {p.image && <img src={imgSrc(p.image)} alt="" className="w-full h-full object-cover" loading="lazy" />}
                        </div>
                      </td>
                      <td className="px-4 py-3 font-medium">{p.title}</td>
                      <td className="px-4 py-3 text-ink-light max-w-[260px] truncate">{linkLabel(p)}</td>
                      <td className="px-4 py-3 whitespace-nowrap text-ink-light">{fmtPeriod(p.start_date, p.end_date)}</td>
                      <td className="px-4 py-3"><Badge className={st.cls}>{st.label}</Badge></td>
                      <td className="px-4 py-3"><Toggle label="노출" checked={p.visible} onChange={(v) => patch(p.id, { visible: v }, v ? '노출합니다.' : '숨겼습니다.')} /></td>
                      <td className="px-4 py-3 whitespace-nowrap">
                        <Button size="sm" variant="secondary" onClick={() => setEditing({ ...p, start_date: p.start_date || '', end_date: p.end_date || '', link_target: p.link_target || '' })}>수정</Button>
                        <Button size="sm" variant="ghost" onClick={() => setConfirmId(p.id)} className="hover:!text-danger">삭제</Button>
                      </td>
                    </tr>
                  );
                })}
              </Table>
            )}
          </Card>
          <SiteDelayNote />
          {editing && <PopupForm initial={editing} events={eventList} onClose={() => setEditing(null)} onSave={save} />}
          <ConfirmModal isOpen={confirmId !== null} onClose={() => setConfirmId(null)} message="이 팝업을 삭제할까요?"
            onConfirm={() => { remove(confirmId); setConfirmId(null); }} />
        </>
      );
    }

    function PopupForm({ initial, events, onClose, onSave }) {
      const [f, setF] = useState(initial);
      const [saving, setSaving] = useState(false);
      const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
      const submit = async () => { setSaving(true); await onSave(f); setSaving(false); };
      // 연결 방식을 바꾸면 대상 기본값도 맞춰 준다
      const changeType = (e) => {
        const t = e.target.value;
        const target = t === 'page' ? '/' : t === 'event' ? String(events[0]?.id || '') : t === 'url' ? 'https://' : '';
        setF({ ...f, link_type: t, link_target: target });
      };
      return (
        <Modal isOpen onClose={onClose} title={f.id ? '팝업 수정' : '팝업 등록'} size="lg"
          footer={<><Button variant="secondary" onClick={onClose}>취소</Button><Button onClick={submit} disabled={saving}>{saving ? '저장 중…' : '저장'}</Button></>}>
          <div className="space-y-4">
            <Input id="pp-title" label="제목 (관리용 · 이미지 대체 텍스트)" value={f.title} onChange={set('title')} maxLength={100} />
            <ImageField id="pp-image" label="팝업 이미지" value={f.image} onChange={(v) => setF({ ...f, image: v })} hint="권장: 가로형 1400×760 (기존 팝업과 같은 비율). PC에서 최대 864px 폭으로 표시됩니다." />
            <div className="grid sm:grid-cols-2 gap-3">
              <Select id="pp-link-type" label="클릭 시 이동" value={f.link_type} onChange={changeType} options={LINK_TYPE_OPTIONS} />
              {f.link_type === 'page' && <Select id="pp-link-page" label="이동할 메뉴" value={f.link_target} onChange={set('link_target')} options={SITE_PAGES} />}
              {f.link_type === 'event' && (events.length
                ? <Select id="pp-link-event" label="연결할 이벤트" value={String(f.link_target)} onChange={set('link_target')} options={events.map(e => ({ value: String(e.id), label: `${e.title}${e.visible ? '' : ' (숨김)'}` }))} />
                : <p className="self-end pb-2 text-xs text-danger">먼저 이벤트 메뉴에서 이벤트를 등록하세요.</p>)}
              {f.link_type === 'url' && <Input id="pp-link-url" label="외부 링크 주소" value={f.link_target} onChange={set('link_target')} placeholder="https://" />}
            </div>
            <div className="grid grid-cols-3 gap-3">
              <Input id="pp-start" type="date" label="시작일 (비우면 바로)" value={f.start_date} onChange={set('start_date')} />
              <Input id="pp-end" type="date" label="종료일 (비우면 상시)" value={f.end_date} onChange={set('end_date')} />
              <Input id="pp-sort" type="number" label="순서 (작을수록 먼저)" value={f.sort} onChange={set('sort')} />
            </div>
            <div className="flex items-center gap-3 text-sm"><Toggle label="노출" checked={f.visible} onChange={(v) => setF({ ...f, visible: v })} /> 홈페이지에 팝업 노출</div>
          </div>
        </Modal>
      );
    }

    // ========================================
    // 📄 Page: 접속 통계
    // ========================================
    function StatsPage() {
      const { state } = useStore();
      const total = state.visits.reduce((s, v) => s + v.count, 0);
      const avg = Math.round(total / Math.max(1, state.visits.length));
      const peak = state.visits.reduce((a, b) => (b.count > a.count ? b : a), state.visits[0] || { count: 0, date: '' });
      return (
        <>
          <PageHeader title="접속 통계" desc="최근 14일 (예시 데이터)" />
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <Card className="p-5"><p className="text-sm text-ink-light">14일 합계</p><p className="mt-2 text-3xl font-bold">{total.toLocaleString('ko-KR')}</p></Card>
            <Card className="p-5"><p className="text-sm text-ink-light">일 평균</p><p className="mt-2 text-3xl font-bold">{avg.toLocaleString('ko-KR')}</p></Card>
            <Card className="p-5"><p className="text-sm text-ink-light">최다 방문일</p><p className="mt-2 text-3xl font-bold text-brand">{peak.count}<span className="ml-2 text-sm font-normal text-ink-light">{fmtDate(peak.date)}</span></p></Card>
          </div>
          <Card className="mt-6 p-5"><VisitChart data={state.visits} /></Card>
          <Card className="mt-6">
            <Table head={['날짜', '방문자']}>
              {[...state.visits].reverse().map(v => (
                <tr key={v.date}><td className="px-4 py-2.5">{fmtDate(v.date)}</td><td className="px-4 py-2.5">{v.count.toLocaleString('ko-KR')}</td></tr>
              ))}
            </Table>
          </Card>
        </>
      );
    }

    // ========================================
    // 📄 Page: 사이트 설정
    // ========================================
    function SettingsPage() {
      const { state, dispatch } = useStore();
      const toast = useToast();
      const [f, setF] = useState(state.settings);
      const [resetOpen, setResetOpen] = useState(false);
      const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
      const fields = [
        ['clinicName', '병원명'], ['ceo', '대표자'], ['bizNo', '사업자 등록번호'], ['phone', '상담 전화'], ['email', '이메일'],
        ['hoursWeekday', '진료시간 (월-금)'], ['hoursSat', '진료시간 (토)'], ['lunch', '점심시간'],
      ];
      return (
        <>
          <PageHeader title="사이트 설정" desc="푸터·오시는 길·상단 띠 배너에 표시되는 정보" />
          <Card className="p-6">
            <div className="grid md:grid-cols-2 gap-4">
              {fields.map(([k, label]) => <Input key={k} id={`st-${k}`} label={label} value={f[k]} onChange={set(k)} />)}
              <Input id="st-address" label="주소" value={f.address} onChange={set('address')} className="md:col-span-2" />
              <Input id="st-banner" label="상단 띠 배너 문구" value={f.topBanner} onChange={set('topBanner')} className="md:col-span-2" />
            </div>
            <div className="mt-6 flex flex-wrap justify-between gap-2">
              <Button variant="ghost" onClick={() => setResetOpen(true)} className="hover:!text-danger">예시 데이터 초기화</Button>
              <Button onClick={() => { dispatch({ type: 'settings', patch: f }); toast('설정이 저장되었습니다.'); }}>저장</Button>
            </div>
          </Card>
          <Modal isOpen={resetOpen} onClose={() => setResetOpen(false)} title="예시 데이터 초기화" size="sm"
            footer={<><Button variant="secondary" onClick={() => setResetOpen(false)}>취소</Button>
              <Button variant="danger" onClick={() => { dispatch({ type: 'reset' }); setF(SEED.settings); setResetOpen(false); toast('초기화되었습니다.'); }}>초기화</Button></>}>
            <p className="text-sm leading-6">이 브라우저에 저장된 모든 변경 내용을 지우고 처음 예시 데이터로 되돌립니다.</p>
          </Modal>
        </>
      );
    }

    function NotFoundPage() {
      return (
        <Card className="py-24 text-center">
          <p className="text-5xl font-bold text-brand">404</p>
          <p className="mt-3 text-ink-mid">페이지를 찾을 수 없습니다.</p>
          <Link to="/" className="inline-block mt-6 text-sm text-brand hover:underline">대시보드로</Link>
        </Card>
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================
    // ========================================
    // 📄 Page: 비밀번호 재설정 (로그인 없이, 일회용 재설정 코드 필요)
    // ========================================
    function ResetPage({ onDone }) {
      const [token, setToken] = useState('');
      const [users, setUsers] = useState(null);
      const [username, setUsername] = useState('');
      const [pw, setPw] = useState({ next: '', confirm: '' });
      const [error, setError] = useState('');
      const [busy, setBusy] = useState(false);
      const post = async (body) => {
        const r = await fetch('/api/admin/reset', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        const j = await r.json().catch(() => ({}));
        if (r.status === 404) throw new Error('지금은 재설정이 꺼져 있습니다. 관리자에게 재설정 코드를 요청하세요.');
        if (!r.ok || j.ok === false) throw new Error(j.message || `요청 실패 (${r.status})`);
        return j;
      };
      const checkToken = async (e) => {
        e.preventDefault(); setError(''); setBusy(true);
        try { const j = await post({ token }); setUsers(j.users); setUsername(j.users[0]?.username || ''); }
        catch (err) { setError(err.message); } finally { setBusy(false); }
      };
      const ok = PW_RULES.every(r => r.test(pw.next)) && !(username && pw.next.toLowerCase().includes(username));
      const submit = async (e) => {
        e.preventDefault(); setError('');
        if (!ok) return setError('새 비밀번호가 규칙에 맞지 않습니다.');
        if (pw.next !== pw.confirm) return setError('새 비밀번호 확인이 일치하지 않습니다.');
        setBusy(true);
        try { const j = await post({ token, username, password: pw.next }); onDone(`${j.message} (아이디: ${username})`); }
        catch (err) { setError(err.message); } finally { setBusy(false); }
      };
      return (
        <div className="min-h-screen flex items-center justify-center p-4">
          <Card className="w-full max-w-md p-8">
            <p className="text-sm text-ink-light text-center">라인앤코한의원</p>
            <h1 className="mt-1 text-2xl font-bold text-center">관리자 비밀번호 재설정</h1>
            {!users ? (
              <form onSubmit={checkToken} className="mt-8 space-y-4">
                <Input id="rs-token" label="재설정 코드" value={token} onChange={(e) => { setToken(e.target.value); setError(''); }} autoComplete="off" placeholder="전달받은 재설정 코드 붙여넣기" />
                {error && <p role="alert" className="text-sm text-danger">{error}</p>}
                <Button type="submit" size="lg" className="w-full" disabled={busy || !token.trim()}>{busy ? '확인 중…' : '확인'}</Button>
              </form>
            ) : (
              <form onSubmit={submit} className="mt-8 space-y-4">
                <div>
                  <p className="mb-1.5 text-[13px] font-medium text-ink-mid">관리자 아이디</p>
                  {users.length === 1 ? (
                    <p className="h-10 px-3 flex items-center rounded-md bg-bg font-bold text-ink">{users[0].username} <span className="ml-2 text-xs font-normal text-ink-light">{users[0].name}</span></p>
                  ) : (
                    <Select id="rs-user" value={username} onChange={(e) => setUsername(e.target.value)} options={users.map(u => ({ value: u.username, label: `${u.username} (${u.name})` }))} />
                  )}
                </div>
                <input type="text" name="username" autoComplete="username" value={username} readOnly hidden />
                <Input id="rs-next" type="password" label="새 비밀번호" value={pw.next} onChange={(e) => { setPw({ ...pw, next: e.target.value }); setError(''); }} autoComplete="new-password" />
                <ul className="space-y-1 text-xs">
                  {PW_RULES.map(r => { const v = r.test(pw.next); return <li key={r.label} className={v ? 'text-mint-deep' : 'text-ink-light'}>{v ? '✓' : '·'} {r.label}</li>; })}
                </ul>
                <Input id="rs-confirm" type="password" label="새 비밀번호 확인" value={pw.confirm} onChange={(e) => { setPw({ ...pw, confirm: e.target.value }); setError(''); }} autoComplete="new-password"
                  error={pw.confirm && pw.confirm !== pw.next ? '새 비밀번호와 다릅니다.' : ''} />
                {error && <p role="alert" className="text-sm text-danger">{error}</p>}
                <Button type="submit" size="lg" className="w-full" disabled={busy}>{busy ? '저장 중…' : '비밀번호 재설정'}</Button>
              </form>
            )}
            <p className="mt-6 text-center"><a href="#/" className="text-sm text-ink-light hover:text-brand">로그인 화면으로</a></p>
          </Card>
        </div>
      );
    }

    function App() {
      // 'checking' → 서버에 세션 확인 중 / null → 로그아웃 상태 / 객체 → 로그인한 관리자
      const [user, setUser] = useState('checking');
      const [notice, setNotice] = useState('');
      const [resetMode, setResetMode] = useState(() => window.location.hash.startsWith('#/reset'));
      useEffect(() => {
        const onHash = () => setResetMode(window.location.hash.startsWith('#/reset'));
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, []);

      useEffect(() => {
        api('/me').then(r => setUser(r.user)).catch(() => setUser(null));
        // 사용 중 토큰이 만료되면(401) 로그인 화면으로
        onUnauthorized = () => { setUser(null); setNotice('로그인이 만료되었습니다. 다시 로그인해주세요.'); };
        return () => { onUnauthorized = () => {}; };
      }, []);

      const login = (u) => { setNotice(''); setUser(u); window.location.hash = '/'; };
      const logout = async () => {
        try { await api('/logout', { method: 'POST' }); } catch {}
        setNotice('로그아웃되었습니다.');
        setUser(null);
      };

      if (user === 'checking') {
        return <div className="min-h-screen flex items-center justify-center"><Spinner label="로그인 상태 확인 중…" /></div>;
      }
      // 비밀번호를 잊었을 때: admin.html#/reset (서버에 일회용 재설정 코드가 있을 때만 동작)
      if (!user && resetMode) return <ResetPage onDone={(msg) => { setNotice(msg); window.location.hash = '/'; }} />;
      if (!user) return <LoginPage onLogin={login} notice={notice} />;

      return (
        <StoreProvider>
          <ToastProvider>
            <Router>
              <Header user={user} onLogout={logout} />
              <DemoNotice />
              <main className="max-w-[1600px] mx-auto px-5 py-8">
                <Routes fallback={<NotFoundPage />}>
                  <Route path="/" element={<DashboardPage />} />
                  <Route path="/consults" element={<ConsultsPage />} />
                  <Route path="/members" element={<MembersPage />} />
                  <Route path="/reviews" element={<ReviewsPage />} />
                  <Route path="/photos" element={<PhotosPage />} />
                  <Route path="/events" element={<EventsPage />} />
                  <Route path="/popups" element={<PopupsPage />} />
                  <Route path="/stats" element={<StatsPage />} />
                  <Route path="/settings" element={<SettingsPage />} />
                </Routes>
              </main>
            </Router>
          </ToastProvider>
        </StoreProvider>
      );
    }

    // ========================================
    // Rendering
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
